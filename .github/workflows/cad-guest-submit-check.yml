name: CAD guest submit check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cad-guest-submit-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anonymous-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authenticated broker busy guard without browser credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {randomUUID} from 'node:crypto';
          const run=await fetch('https://api.github.com/repos/maxjimtech/maxjimtech.github.io/actions/runs/39124398714').then(r=>{assert.equal(r.status,200);return r.json();});
          if(run.status!=='in_progress'){
            fs.writeFileSync('guest-submit-check.json',JSON.stringify({status:'skipped',reason:'Reference job is no longer running; no generation requested.'}));
            console.log('Reference job completed; no submission made.');process.exit(0);
          }
          const requirements=JSON.parse(fs.readFileSync('services/cad-cloud/defaults.json','utf8'));
          requirements.project='RD065_Guest_Smoke';
          const job_id=randomUUID();
          const response=await fetch('https://rd065-cad-guest.vercel.app/api/cad',{method:'POST',headers:{Origin:'https://maxjimtech.github.io','Content-Type':'application/json'},body:JSON.stringify({job_id,requirements}),signal:AbortSignal.timeout(30000)});
          const result=await response.json();
          fs.writeFileSync('guest-submit-check.json',JSON.stringify({http_status:response.status,job_id,result},null,2));
          // A completed reference job racing this request may allow one real job.
          // It is recorded, counts toward the normal four/day budget, and is not retried.
          assert.ok(response.status===429||response.status===202,JSON.stringify(result));
          if(response.status===429)assert.match(result.message,/正在建模/);
          console.log(response.status===429?'GUEST_BUSY_GUARD_PASS':'GUEST_SUBMISSION_ACCEPTED');
          NODE
      - name: Save anonymous request evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-submit-check
          path: guest-submit-check.json
          retention-days: 14
