name: CAD anonymous end-to-end
on:
  push:
    branches: [main]
    paths: ['services/cad-cloud/deployment.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cad-anonymous-e2e
  cancel-in-progress: false
jobs:
  real-production-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: cad-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser only on hosted runner
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Submit once without login, reload and wait for actual CAD
        run: node tests/guest_e2e.mjs
      - name: Verify downloaded ZIP, native document and STEP evidence
        run: python -B tests/check_live_package.py
      - name: Preserve real production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-production-flow
          path: |
            cad-cloud/test-results/live/*.json
            cad-cloud/test-results/live/*.png
          retention-days: 30
