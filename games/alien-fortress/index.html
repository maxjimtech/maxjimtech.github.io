<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>外星人攻擊堡壘 DX</title><style>*{box-sizing:border-box}body{margin:0;background:#020809;color:#81ff9c;font:16px monospace;touch-action:none;text-align:center}header{display:flex;justify-content:space-around;gap:5px;flex-wrap:wrap;margin:8px auto;max-width:960px;font-size:clamp(11px,2vw,17px)}canvas{display:block;margin:auto;width:min(960px,100vw);height:auto;max-height:75vh;background:#000;border:2px solid #3f8;image-rendering:pixelated}button{background:#102519;color:#8fa;border:1px solid #3f8;border-radius:7px;padding:11px 15px;font:bold 16px monospace;margin:5px;touch-action:none}#touch{display:none;justify-content:space-between;max-width:960px;margin:auto}#touch button{min-width:74px;min-height:58px}#fire{border-color:#f66;color:#f99}@media(pointer:coarse),(max-width:700px){#touch{display:flex}canvas{max-height:67vh}small{display:none}}</style></head><body><header><span>SCORE <b id="score">000000</b></span><span>HI <b id="hi">000000</b></span><span>LEVEL <b id="level">1</b></span><span>LIVES <b id="lives">3</b></span><span id="power">POWER -</span></header><canvas id="game" width="960" height="650"></canvas><div><button id="start">開始／重新開始</button><button id="pause">暫停</button><button id="rank">排行榜</button><a href="../" style="color:#8fa">遊戲館</a></div><div id="touch"><div><button id="left">◀</button><button id="right">▶</button></div><button id="fire">FIRE</button></div><small>← → / A D 移動，空白鍵射擊，P 暫停；每 5 關 BOSS</small><script>
'use strict';
const c=document.getElementById('game'),g=c.getContext('2d'),W=960,H=650,$=id=>document.getElementById(id),keys={},colors=['#ff6878','#ffe36b','#60ff87'];g.imageSmoothingEnabled=false;
let score=0,hi=+(localStorage.getItem('alienDXHighScore')||0),level=1,lives=3,run=false,paused=false,over=false,ranking=false,player,aliens=[],shots=[],enemy=[],forts=[],drops=[],sparks=[],texts=[],stars=[],ufo=null,boss=null,dir=1,shootClock=0,ufoClock=8,stepClock=0,frame=0,last=0,audio=null,transition=0;
function tone(f=400,d=.07){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),v=audio.createGain();o.type='square';o.frequency.value=f;v.gain.setValueAtTime(.026,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function flash(x,y,text,color='#ffe46b'){texts.push({x,y,text,color,t:1.3})}
function boom(x,y,color,n=15){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*160;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.25+Math.random()*.45,color})}}
function hud(){if(score>hi){hi=score;try{localStorage.setItem('alienDXHighScore',hi)}catch(e){}}$('score').textContent=String(score).padStart(6,'0');$('hi').textContent=String(hi).padStart(6,'0');$('level').textContent=level;$('lives').textContent=lives;$('power').textContent='POWER '+(['rapid','double','shield','pierce'].filter(k=>player&&player[k]>0).join('+').toUpperCase()||'-')}
function makeForts(){forts=[];for(let k=0;k<4;k++){let f=[];for(let r=0;r<12;r++)for(let col=0;col<18;col++){if(r<2&&(col<4||col>13)||r>7&&col>=6&&col<=11)continue;f.push({x:100+225*k+col*6,y:485+r*6,w:6,h:6,alive:true})}forts.push(f)}}
function makeAliens(){aliens=[];for(let r=0;r<5;r++)for(let col=0;col<11;col++)aliens.push({x:115+col*64,y:80+r*44,w:34,h:25,r,col,alive:true});dir=1;shootClock=.8}
function makeBoss(){const hp=120+level*12;boss={x:380,y:65,w:200,h:75,vx:110,hp,max:hp,clock:.7};aliens=[];enemy=[];tone(90,.4)}
function next(){level++;shots=[];enemy=[];drops=[];makeForts();player.x=455;boss=null;transition=0;if(level%5===0)makeBoss();else makeAliens();hud();tone(850,.2)}
function begin(){score=0;level=1;lives=3;run=true;paused=false;over=false;ranking=false;transition=0;ufo=null;boss=null;shots=[];enemy=[];drops=[];sparks=[];texts=[];player={x:455,y:595,w:50,h:25,v:355,cd:0,inv:0,rapid:0,double:0,shield:0,pierce:0};makeForts();makeAliens();ufoClock=6;$('pause').textContent='暫停';hud();tone()}
function lose(){if(player.inv>0)return;boom(player.x+25,player.y+12,'#6f8',32);tone(80,.35);lives--;enemy=[];player.inv=2;player.x=455;if(lives<=0){run=false;over=true;saveRank()}hud()}
function saveRank(){let r=[];try{r=JSON.parse(localStorage.getItem('alienDXRanking')||'[]')}catch(e){}r.push({score,level,date:new Date().toLocaleDateString()});r.sort((a,b)=>b.score-a.score);try{localStorage.setItem('alienDXRanking',JSON.stringify(r.slice(0,10)))}catch(e){}}
function fire(){if(!run||paused||ranking||player.cd>0)return;player.cd=player.rapid>0?.085:.21;const x=player.x+25;for(const offset of player.double>0?[-10,9]:[0])shots.push({x:x+offset-2,y:player.y-10,w:4,h:14,pierce:player.pierce>0,dead:false});tone(player.pierce>0?820:620,.055)}
function enemyFire(x,y,vx=0,vy=230){enemy.push({x,y,w:5,h:14,vx,vy,dead:false})}
function drop(x,y){const kinds=['rapid','double','shield','pierce','life'];drops.push({x,y,w:24,h:24,kind:kinds[Math.floor(Math.random()*kinds.length)]})}
function crater(b){for(const f of forts)for(const cell of f)if(cell.alive&&rect(b,cell)){const x=cell.x+3,y=cell.y+3;for(const ff of forts)for(const q of ff)if(q.alive){let d=Math.hypot(q.x+3-x,q.y+3-y);if(d<12&&Math.random()<1-d/12+.22)q.alive=false}return true}return false}
function move(dt){if(transition>0){transition-=dt;if(transition<=0&&run)next();return}player.x=Math.max(4,Math.min(906,player.x+((keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0))*player.v*dt));player.cd-=dt;player.inv-=dt;for(const k of ['rapid','double','shield','pierce'])player[k]=Math.max(0,player[k]-dt);if(keys[' '])fire();const alive=aliens.filter(a=>a.alive),n=alive.length;if(!boss){if(!n){next();return}const mult=1+(55-n)*.018+Math.max(0,30-n)*.035+Math.max(0,15-n)*.09+Math.max(0,5-n)*.35;const dx=dir*(24+level*5)*mult*dt;if(alive.some(a=>a.x+dx<12||a.x+dx+a.w>948)){dir*=-1;for(const a of alive){a.y+=19;if(a.y+a.h>player.y-15){run=false;over=true;saveRank();return}}tone(85,.05)}else for(const a of alive)a.x+=dx;shootClock-=dt;if(shootClock<=0){let col=Math.floor(Math.random()*11),low=alive.filter(a=>a.col===col).sort((a,b)=>b.y-a.y)[0];if(low)enemyFire(low.x+16,low.y+24,0,230+level*15);shootClock=Math.max(.18,.85-level*.025+Math.random()*.55)}stepClock+=dt;if(stepClock>(n<=5?.12:n<=15?.20:n<=30?.28:.35)){stepClock=0;frame^=1}}else{boss.x+=boss.vx*dt;if(boss.x<25){boss.x=25;boss.vx=Math.abs(boss.vx)}if(boss.x+boss.w>935){boss.x=735;boss.vx=-Math.abs(boss.vx)}boss.clock-=dt;if(boss.clock<=0){for(let i=-3;i<=3;i++){const a=Math.PI/2+i*.16,s=220+level*7;enemyFire(boss.x+100,boss.y+75,Math.cos(a)*s,Math.sin(a)*s)}boss.clock=Math.max(.28,.85-level*.02);tone(110,.06)}}ufoClock-=dt;if(ufoClock<=0&&!ufo){if(Math.random()<.65){let d=Math.random()<.5?1:-1;ufo={x:d>0?-80:1040,y:38,w:64,h:26,vx:d*(120+Math.random()*90)}}ufoClock=8+Math.random()*12}if(ufo){ufo.x+=ufo.vx*dt;if(ufo.x< -100||ufo.x>1060)ufo=null}for(const b of shots){b.y-=620*dt;if(b.y< -30)b.dead=true}for(const b of enemy){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y>680||b.x< -30||b.x>990)b.dead=true}for(const b of shots){if(b.dead)continue;if(ufo&&rect(b,ufo)){const pts=100+Math.floor(Math.random()*6)*50;score+=pts;flash(ufo.x+32,ufo.y-6,'+'+pts);boom(ufo.x+32,ufo.y+13,'#f5f',24);if(Math.random()<.75)drop(ufo.x+24,ufo.y+13);ufo=null;b.dead=true;tone(1000,.16);continue}if(boss&&rect(b,boss)){boss.hp-=b.pierce?4:1;score+=5;boom(b.x,b.y,'#f8f',3);if(!b.pierce)b.dead=true;if(boss.hp<=0){const pts=2500+level*250;score+=pts;flash(boss.x+100,boss.y,'+'+pts);boom(boss.x+100,boss.y+40,'#f5f',80);boss=null;enemy=[];aliens=[];transition=.6;tone(80,.35)}continue}for(const a of aliens){if(!a.alive||!rect(b,a))continue;a.alive=false;score+=a.r===0?30:a.r<3?20:10;boom(a.x+17,a.y+12,colors[a.r===0?0:a.r<3?1:2],12);if(Math.random()<.035)drop(a.x,a.y);if(!b.pierce)b.dead=true;tone(270,.05);if(b.dead)break}if(!b.dead&&!b.pierce&&crater(b))b.dead=true}for(const b of enemy){if(b.dead)continue;if(crater(b)){b.dead=true;continue}if(player.inv<=0&&rect(b,player)){b.dead=true;if(player.shield>0){player.shield=0;boom(player.x+25,player.y,'#5cf',17);tone(380,.2)}else lose()}}shots=shots.filter(b=>!b.dead);enemy=enemy.filter(b=>!b.dead);for(const p of drops){p.y+=85*dt;if(rect(p,player)){p.dead=true;if(p.kind==='life')lives++;else player[p.kind]=p.kind==='shield'?12:p.kind==='pierce'?8:10;tone(1100,.15)}if(p.y>680)p.dead=true}drops=drops.filter(p=>!p.dead);hud()}
function text(t,y,size=24,color='#8fa'){g.fillStyle=color;g.font=`bold ${size}px monospace`;g.textAlign='center';g.fillText(t,480,y);g.textAlign='left'}
function drawAlien(a){const x=Math.round(a.x),y=Math.round(a.y);g.fillStyle=colors[a.r===0?0:a.r<3?1:2];g.fillRect(x+8,y,18,4);g.fillRect(x+4,y+4,26,5);g.fillRect(x,y+9,34,10);g.fillStyle='#000';g.fillRect(x+8,y+11,4,4);g.fillRect(x+22,y+11,4,4);g.fillStyle=colors[a.r===0?0:a.r<3?1:2];if(frame){g.fillRect(x,y+19,7,6);g.fillRect(x+27,y+19,7,6)}else{g.fillRect(x+6,y+19,7,6);g.fillRect(x+21,y+19,7,6)}}
function draw(){g.fillStyle='#000';g.fillRect(0,0,W,H);g.fillStyle='#557';for(const s of stars)g.fillRect(s.x,s.y,s.z,s.z);if(ranking){g.fillStyle='#06140e';g.fillRect(0,0,W,H);text('TOP 10 PILOTS',75,36);let rs=[];try{rs=JSON.parse(localStorage.getItem('alienDXRanking')||'[]')}catch(e){}if(!rs.length)text('NO RECORD',200);rs.forEach((r,i)=>text(`${String(i+1).padStart(2,'0')}    ${String(r.score).padStart(7,'0')}    LV ${r.level}    ${r.date}`,135+i*41,19,i===0?'#ffe46b':'#fff'));text('點選排行榜返回',600,18);return}if(ufo){g.fillStyle='#f5f';g.fillRect(ufo.x+18,ufo.y,28,5);g.fillRect(ufo.x+8,ufo.y+5,48,7);g.fillRect(ufo.x,ufo.y+12,64,10);g.fillStyle='#9ff';for(let i=0;i<3;i++)g.fillRect(ufo.x+13+i*16,ufo.y+15,6,4)}if(boss){g.fillStyle='#d5f';g.fillRect(boss.x+30,boss.y,140,12);g.fillRect(boss.x+12,boss.y+12,176,17);g.fillRect(boss.x,boss.y+29,200,30);g.fillRect(boss.x+20,boss.y+59,40,14);g.fillRect(boss.x+140,boss.y+59,40,14);g.fillStyle='#ff6';g.fillRect(boss.x+42,boss.y+34,22,10);g.fillRect(boss.x+136,boss.y+34,22,10);g.fillStyle='#444';g.fillRect(230,15,500,12);g.fillStyle='#f55';g.fillRect(230,15,500*Math.max(0,boss.hp/boss.max),12);text('BOSS',25,12,'#fff')}else aliens.filter(a=>a.alive).forEach(drawAlien);g.fillStyle='#4f7';for(const f of forts)for(const cell of f)if(cell.alive)g.fillRect(cell.x,cell.y,6,6);if(player){if(player.shield>0){g.strokeStyle='#5cf';g.lineWidth=3;g.beginPath();g.arc(player.x+25,player.y+12,36,0,Math.PI*2);g.stroke()}if(player.inv<=0||Math.floor(player.inv*12)%2){g.fillStyle='#7f8';g.fillRect(player.x+5,player.y+11,40,13);g.fillRect(player.x+19,player.y,12,13);g.fillRect(player.x,player.y+18,50,7)}}for(const b of shots){g.fillStyle=b.pierce?'#f5f':'#cff';g.fillRect(b.x,b.y,4,14)}g.fillStyle='#f55';for(const b of enemy)g.fillRect(b.x,b.y,5,14);for(const p of drops){g.fillStyle={rapid:'#fd5',double:'#5ff',shield:'#48f',pierce:'#f5f',life:'#6f8'}[p.kind];g.fillRect(p.x,p.y,24,24);g.fillStyle='#000';g.font='bold 17px monospace';g.fillText({rapid:'R',double:'D',shield:'S',pierce:'P',life:'+'}[p.kind],p.x+6,p.y+18)}for(const p of sparks){g.globalAlpha=Math.max(0,p.t/.7);g.fillStyle=p.color;g.fillRect(p.x,p.y,4,4)}g.globalAlpha=1;for(const t of texts){g.globalAlpha=Math.max(0,t.t/1.3);text(t.text,t.y,23,t.color);g.globalAlpha=1}g.strokeStyle='#3f8';g.beginPath();g.moveTo(0,630);g.lineTo(960,630);g.stroke();if(!run&&!over) {text('ALIEN FORTRESS ATTACK DX',280,35);text('PRESS START',340,24,'#fff');text('EVERY 5 LEVELS = BOSS',390,17,'#f8f')}if(paused&&!ranking){g.fillStyle='#000a';g.fillRect(0,0,W,H);text('PAUSED',330,44,'#ff6')}if(over){g.fillStyle='#000b';g.fillRect(0,0,W,H);text('GAME OVER',280,48,'#f66');text('SCORE '+score,345,25,'#fff');text('LEVEL '+level,385,22,'#ff6');text('PRESS START',440,22)}}
function tick(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(run&&!paused&&!ranking){move(dt);for(const s of stars){s.y+=s.v*dt;if(s.y>650)s.y=0}for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}sparks=sparks.filter(p=>p.t>0);for(const t of texts){t.y-=40*dt;t.t-=dt}texts=texts.filter(t=>t.t>0)}draw();requestAnimationFrame(tick)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()==='a'?'a':e.key.toLowerCase()==='d'?'d':e.key]=true;if(e.key.toLowerCase()==='p')toggle()});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()==='a'?'a':e.key.toLowerCase()==='d'?'d':e.key]=false});window.addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);if(run)paused=true});function toggle(){if(!run||ranking)return;paused=!paused;$('pause').textContent=paused?'繼續':'暫停'}$('start').onclick=begin;$('pause').onclick=toggle;$('rank').onclick=()=>{ranking=!ranking;paused=ranking;if(!ranking&&run)paused=false};function bind(id,key){const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();keys[key]=true;e.setPointerCapture(ev.pointerId);if(key===' ')fire()});for(const name of ['pointerup','pointercancel','lostpointercapture'])e.addEventListener(name,()=>keys[key]=false)}bind('left','ArrowLeft');bind('right','ArrowRight');bind('fire',' ');for(let i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.5,v:8+Math.random()*15});player={x:455,y:595,w:50,h:25,inv:0,shield:0};makeForts();makeAliens();hud();requestAnimationFrame(tick);
</script></body></html>
