<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071e28">
<title>青蛙過街｜哲肇遊戲館</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at top,#23515a,#071820);color:#eaffdc;font-family:system-ui,-apple-system,'PingFang TC',sans-serif;text-align:center;padding:20px}main{max-width:430px}h1{font-size:28px}p{line-height:1.8;color:#b4d5d0}a{color:#a4efa3}
</style>
</head>
<body>
<main id="loading" role="status" aria-live="polite"><h1>🐸 青蛙過街</h1><p>正在準備新版河道…</p></main>
<script>
(async function(){
'use strict';
try{
 const response=await fetch('./game-v2.html?v=3',{cache:'no-store'});
 if(!response.ok)throw new Error('遊戲檔案尚未完成發布');
 let source=await response.text();
 function change(before,after){
  if(source.split(before).length!==2)throw new Error('遊戲版本不相容，請重新整理');
  source=source.replace(before,after);
 }
 // 車道數量、車速、生命與計時完全沿用上一版；僅調整河道浮具與水流。
 change('len+=level===1?48:level===2?27:level===3?12:0',
        'len+=level===1?24:level===2?14:level===3?5:0');
 change('const speedFactor=levelSpeed(level);for(const lane of lanes){for(const o of lane.objects){o.x+=lane.speed*speedFactor*dt;',
        'const speedFactor=levelSpeed(level);for(const lane of lanes){const laneFactor=lane.row<=5?(level===1?.69:level===2?.83:level===3?.96:speedFactor):speedFactor;for(const o of lane.objects){o.x+=lane.speed*laneFactor*dt;');
 change('frog.x+=lane.speed*speedFactor*dt;',
        'frog.x+=lane.speed*(level===1?.69:level===2?.83:level===3?.96:speedFactor)*dt;');
 change('第 1 關：車速慢、車量少，先看準空隙再跳！',
        '第 1 關：車道維持入門難度；河道的浮木空隙變大、水流加快了！');
 document.open();
 document.write(source);
 document.close();
}catch(error){
 const loading=document.getElementById('loading');
 if(loading){
  loading.replaceChildren();
  const title=document.createElement('h1');title.textContent='🐸 遊戲載入失敗';
  const message=document.createElement('p');message.textContent=error.message||'暫時無法載入';
  const retry=document.createElement('a');retry.href='./?v=3';retry.textContent='點此重新整理';
  loading.append(title,message,retry);
 }
 console.error('Frogger river tuning:',error);
}
})();
</script>
</body>
</html>
