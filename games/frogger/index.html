<title>青蛙過街｜哲肇遊戲館</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#ecfff6;background:#071e28;font-synthesis:none}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overflow:hidden}body{background:radial-gradient(ellipse at 50% -12%,#23515a 0%,#102f3c 46%,#071820 100%)}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}#app{height:var(--vh,100dvh);width:100%;max-width:620px;margin:auto;padding:max(5px,env(safe-area-inset-top)) 10px max(5px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:5px;overflow:hidden}.top{width:100%;max-width:548px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:27px}.top a{color:#a7e8d5;text-decoration:none;font-size:12px;font-weight:750}.top .brand{color:#87d6be;font-size:10px;font-weight:850;letter-spacing:.19em}h1{font-size:clamp(19px,4.7vw,25px);line-height:1.1;margin:0 0 1px;font-weight:900;letter-spacing:.04em;text-shadow:0 2px 12px #0008}.hud{width:100%;max-width:548px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.stat{background:linear-gradient(165deg,#1b4147,#102c36);border:1px solid #3a7777;border-radius:10px;text-align:center;padding:4px 3px;box-shadow:inset 0 1px #ffffff12}.stat small{display:block;color:#a1cabe;font-size:9px;font-weight:800;letter-spacing:.05em}.stat strong{font:900 clamp(15px,4vw,21px)/1.2 ui-monospace,Menlo,monospace;color:#f3fff1;font-variant-numeric:tabular-nums}.stat:nth-child(3) strong{color:#ffda80}.board{position:relative;flex:0 1 auto;width:min(100%,548px,calc((var(--vh,100dvh) - 193px)*.8653846));aspect-ratio:540/624;min-width:0;min-height:0;overflow:hidden;border:2px solid #6aa794;border-radius:15px;background:#073b45;box-shadow:0 4px 0 #0a4142,0 15px 38px #0008,inset 0 0 0 1px #ffffff30}canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:#061d27bb;backdrop-filter:blur(5px);z-index:4}.overlay[hidden]{display:none}.dialog{width:min(100%,365px);max-height:96%;overflow:auto;text-align:center;padding:19px 16px 16px;border:1px solid #72c5a4;border-radius:20px;background:linear-gradient(155deg,#1a4f51,#0a2938 90%);box-shadow:0 22px 55px #000b,inset 0 1px #ffffff32}.dialog .hero{font-size:40px;line-height:1.1}.dialog h2{font-size:25px;margin:8px 0;color:#d5ffc2}.dialog p{font-size:12px;line-height:1.8;color:#d4eee6;margin:8px 0 13px}.dialog b{color:#ffdf89}.action{background:linear-gradient(#d6ffa5,#8fe27a);color:#14372b;border:0;border-radius:999px;padding:11px 30px;font-size:16px;font-weight:950;box-shadow:0 4px 0 #3e8451}.action:active{transform:translateY(3px);box-shadow:0 1px 0 #3e8451}.sub{color:#a8cfcb;font-size:10px;margin-top:11px}.note{width:100%;max-width:548px;min-height:17px;text-align:center;color:#b9d8cb;font-size:11px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ctrls{width:100%;max-width:548px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:7px;align-items:center;justify-items:stretch;margin-top:auto}.ctrl{min-height:43px;background:linear-gradient(#28565a,#17343f);color:#e2fff0;border:1px solid #5eaca1;border-radius:12px;font-size:22px;font-weight:900;box-shadow:0 3px 0 #09272e;user-select:none;-webkit-user-select:none}.ctrl:active,.ctrl.pressed{background:#4b877d;transform:translateY(2px);box-shadow:0 1px 0 #09272e}.ctrl.pause{font-size:13px;color:#f8dfa4;border-color:#9c9163}.help{width:100%;max-width:548px;margin:0;text-align:center;color:#86ada9;font-size:10px;line-height:1.35}@media(max-height:650px){#app{gap:3px}.top{min-height:22px}.stat{padding:2px}.ctrl{min-height:37px}.help{display:none}.board{width:min(100%,548px,calc((var(--vh,100dvh) - 167px)*.8653846))}.dialog{padding:12px}.dialog .hero{font-size:30px}.dialog h2{font-size:21px}}
</style>

<body>
<main id="app">
 <div class="top"><a href="../">← 哲肇遊戲館</a><span class="brand">FOREST ARCADE / 01</span></div>
 <h1>🐸 青蛙過街</h1>
 <div class="hud" aria-live="polite"><div class="stat"><small>分數 SCORE</small><strong id="score">0</strong></div><div class="stat"><small>生命 LIVES</small><strong id="lives">♥ ♥ ♥</strong></div><div class="stat"><small>剩餘 TIME</small><strong id="time">45</strong></div><div class="stat"><small>關卡 LEVEL</small><strong id="level">1</strong></div></div>
 <div class="board" id="board"><canvas id="game" aria-label="青蛙過街遊戲畫面：從底部草地跨越車道與河流，抵達頂端五個荷葉洞口"></canvas>
  <div class="overlay" id="overlay"><div class="dialog"><div class="hero" id="hero">🐸🌿</div><h2 id="heading">青蛙過街</h2><p id="description">穿越 <b>5 條馬路</b>、搭乘浮木與海龜越過 <b>5 條河道</b>，把青蛙送進頂端 <b>5 個荷葉家</b>。<br>撞到車、落水或超時會失去一顆愛心。</p><button class="action" type="button" id="action">開始冒險</button><div class="sub" id="sub">方向鍵 / WASD · 手機滑動或點選方向按鈕</div></div></div>
 </div>
 <div class="note" id="note" aria-live="polite">往上跳！車道要閃避，河道要站在浮木或海龜上。</div>
 <div class="ctrls"><button class="ctrl pause" id="pause" aria-label="暫停遊戲">Ⅱ 暫停</button><button class="ctrl" data-dir="left" aria-label="向左">◀</button><button class="ctrl" data-dir="up" aria-label="向上">▲</button><button class="ctrl" data-dir="down" aria-label="向下">▼</button><button class="ctrl" data-dir="right" aria-label="向右">▶</button></div>
 <p class="help">電腦用 ↑ ↓ ← →／WASD；手機滑動棋盤或點方向鍵。最高分保存在這台裝置。</p>
</main>
<script>
(()=>{'use strict';
const W=540,H=624,CELL=48,GOALS=[78,174,270,366,462];
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id),els={overlay:$('overlay'),hero:$('hero'),heading:$('heading'),desc:$('description'),action:$('action'),sub:$('sub'),score:$('score'),lives:$('lives'),time:$('time'),level:$('level'),note:$('note')};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rand=(n,s=0)=>{let t=Math.sin(n*127.1+s*311.7)*43758.5453123;return t-Math.floor(t)};
const river=[{row:1,speed:68,type:'log',len:172,x:[-95,145,385]},{row:2,speed:-79,type:'turtle',len:124,x:[-48,154,356,558]},{row:3,speed:83,type:'log',len:150,x:[-72,145,360,575]},{row:4,speed:-73,type:'turtle',len:139,x:[-30,190,405,620]},{row:5,speed:61,type:'log',len:188,x:[-120,135,405]}];
const road=[{row:7,speed:-110,type:'car',len:77,color:'#f6b65e',x:[15,177,340,501]},{row:8,speed:91,type:'van',len:119,color:'#74d3d0',x:[-63,195,452]},{row:9,speed:-142,type:'car',len:72,color:'#f07887',x:[24,190,353,516]},{row:10,speed:105,type:'truck',len:134,color:'#aa9bf6',x:[-102,194,486]},{row:11,speed:-123,type:'car',len:68,color:'#8ce2ad',x:[12,168,324,480]}];
let lanes=[],frog={x:270,row:12,facing:'up'},homes=[false,false,false,false,false];
let score=0,lives=3,level=1,time=45,best=0,state='menu',furthest=12,last=0,clock=0,particles=[],message='',messageTime=0,hop=0,lastMove=0;
try{best=Number(localStorage.getItem('zhaozhao_frogger_best')||0)||0}catch(_e){}
function resize(){const vv=window.visualViewport;document.documentElement.style.setProperty('--vh',(vv?vv.height:window.innerHeight)+'px');const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;const dpr=Math.min(window.devicePixelRatio||1,3);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high'}
window.addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
const gradient=(x,y,w,h,a,b)=>{const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(x,y,w,h)};
function rounded(x,y,w,h,r,fill,stroke){if(w<=0||h<=0)return;const q=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+q,y);ctx.arcTo(x+w,y,x+w,y+h,q);ctx.arcTo(x+w,y+h,x,y+h,q);ctx.arcTo(x,y+h,x,y,q);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function text(t,x,y,size,color,align='center'){ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.font=`900 ${size}px system-ui,sans-serif`;ctx.fillText(t,x,y)}
function setupLanes(){lanes=[...river,...road].map(s=>({...s,objects:s.x.map((x,i)=>({x:x+(i%2)*5}))}))}
function hud(){els.score.textContent=score;els.lives.textContent='♥ '.repeat(lives).trim()||'—';els.time.textContent=Math.ceil(time);els.level.textContent=level}
function record(){if(score>best){best=score;try{localStorage.setItem('zhaozhao_frogger_best',String(best))}catch(_e){}}}
function resetFrog(){frog={x:270,row:12,facing:'up'};furthest=12;time=45;hop=0;hud()}
function modal(icon,title,description,button,subtitle,callback){els.hero.textContent=icon;els.heading.textContent=title;els.desc.innerHTML=description;els.action.textContent=button;els.sub.textContent=subtitle;els.action.onclick=callback;els.overlay.hidden=false}
function begin(){score=0;lives=3;level=1;homes.fill(false);setupLanes();particles=[];resetFrog();state='playing';els.overlay.hidden=true;els.note.textContent='從草地出發，先閃車，再乘浮木和海龜過河！';hud();last=performance.now()}
function resume(){state='playing';els.overlay.hidden=true;last=performance.now()}
function pause(){if(state==='playing'){state='paused';modal('⏸️','冒險暫停',`目前 <b>${score}</b> 分，最高紀錄 <b>${best}</b> 分。`,`繼續遊戲`,'按 P 或空白鍵也可以繼續',resume)}else if(state==='paused')resume()}
function spark(x,y,color,count=14){for(let i=0;i<count;i++){let a=i*Math.PI*2/count+rand(i,clock)*.6,s=55+rand(i,clock+3)*110;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.65,max:.65,color,size:2+rand(i,clock)*3})}}
function say(t){els.note.textContent=t;message=t;messageTime=1.4}
function lose(reason){if(state!=='playing')return;spark(frog.x,frog.row*CELL+24,reason==='落水！'?'#a6ffff':'#ffc48e',18);lives--;record();if(lives<=0){state='over';hud();modal('🌙🐸','冒險結束',`本次得分 <b>${score}</b> 分<br>本機最高紀錄 <b>${best}</b> 分`,`再挑戰一次`,'避開車流，記得乘著浮木前進',begin)}else{resetFrog();say(`${reason} 還剩 ${lives} 顆愛心。`)}hud()}
function home(){const slot=GOALS.findIndex((x,i)=>!homes[i]&&Math.abs(frog.x-x)<32);if(slot<0){lose('沒有對準空的荷葉！');return}homes[slot]=true;score+=50+Math.floor(time)*2;spark(GOALS[slot],24,'#d8ff87',23);record();if(homes.every(Boolean)){state='level';score+=500;record();hud();modal('🌟🐸','五隻青蛙都回家了！',`過關獎勵 <b>+500</b> 分！<br>目前 <b>${score}</b> 分，進入第 <b>${level+1}</b> 關後車速會稍快。`,'挑戰下一關',`本機最高：${best} 分`,()=>{level++;homes.fill(false);setupLanes();resetFrog();state='playing';els.overlay.hidden=true;hud();last=performance.now()})}else{resetFrog();say(`成功回家！已完成 ${homes.filter(Boolean).length}/5 個荷葉。`)}hud()}
function step(dir){if(state!=='playing')return;const now=performance.now();if(now-lastMove<90)return;lastMove=now;let x=frog.x,row=frog.row;if(dir==='left'){x-=CELL;frog.facing='left'}if(dir==='right'){x+=CELL;frog.facing='right'}if(dir==='up'){row--;frog.facing='up'}if(dir==='down'){row++;frog.facing='down'}if(x<17||x>W-17||row>12)return;frog.x=x;frog.row=row;hop=.16;if(row<furthest){score+=10;furthest=row;record()}if(row===0)home();hud()}
function advance(dt){clock+=dt;if(state!=='playing'){updateParticles(dt);return}time-=dt;if(time<=0){lose('時間到！');return}const speedFactor=Math.min(2,1+(level-1)*.14);for(const lane of lanes){for(const o of lane.objects){o.x+=lane.speed*speedFactor*dt;if(lane.speed>0&&o.x>W+36)o.x=-lane.len-36;if(lane.speed<0&&o.x+lane.len< -36)o.x=W+36}}
if(frog.row>=1&&frog.row<=5){const lane=lanes.find(l=>l.row===frog.row);const carrier=lane.objects.find(o=>frog.x>o.x+17&&frog.x<o.x+lane.len-17);if(!carrier){lose('落水！');return}frog.x+=lane.speed*speedFactor*dt;if(frog.x<13||frog.x>W-13){lose('被水流帶走了！');return}}
if(frog.row>=7&&frog.row<=11){const lane=lanes.find(l=>l.row===frog.row);if(lane.objects.some(o=>frog.x+13>o.x+7&&frog.x-13<o.x+lane.len-7)){lose('被車撞到了！');return}}
hop=Math.max(0,hop-dt);messageTime=Math.max(0,messageTime-dt);updateParticles(dt);hud()}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}}
function grass(row,t){const y=row*CELL;gradient(0,y,W,CELL,row===12?'#326449':'#387759',row===12?'#204638':'#255641');ctx.strokeStyle='#9ade8b24';ctx.lineWidth=1;for(let i=0;i<90;i++){let x=rand(i,row)*W,yy=y+rand(i+100,row)*(CELL-4)+2;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x-2,yy-3-rand(i+22,row)*4);ctx.moveTo(x,yy);ctx.lineTo(x+2,yy-4);ctx.stroke()}for(let i=0;i<8;i++)ellipse(rand(i+8,row)*W,y+rand(i+13,row)*CELL,2,1,'#f8ffb746');ctx.fillStyle='#ffffff10';ctx.fillRect(0,y,W,1)}
function drawWater(t){gradient(0,48,W,240,'#126172','#073e5a');for(let r=1;r<=5;r++){let y=r*CELL;ctx.fillStyle=r%2?'#39b6a10d':'#a1e6dd09';ctx.fillRect(0,y,W,CELL);for(let i=0;i<10;i++){let x=(i*73+r*49+(t*16*(i%2?1:-1)))% (W+95);if(x<0)x+=W+95;let yy=y+9+rand(i,r)*30;ctx.strokeStyle=i%3?'#84eee328':'#b9ffec48';ctx.lineWidth=1.3;ctx.beginPath();ctx.ellipse(x,yy,9+i%3*3,2.4,0,Math.PI*.05,Math.PI*.87);ctx.stroke()}}ctx.fillStyle='#92eec51d';ctx.fillRect(0,48,W,2);ctx.fillRect(0,286,W,2)}
function drawRoad(){gradient(0,336,W,240,'#26333c','#1b2732');for(let r=7;r<=11;r++){const y=r*CELL;ctx.fillStyle=r%2?'#ffffff04':'#00000013';ctx.fillRect(0,y,W,CELL);if(r>7){ctx.fillStyle='#d2cc9b77';for(let x=9;x<W;x+=68)rounded(x,y-1,38,2,1,'#bfbfa583')}for(let i=0;i<11;i++){let x=rand(i+30,r)*W,yy=y+rand(i+55,r)*CELL;ctx.fillStyle='#aec2be14';ctx.fillRect(x,yy,rand(i+86,r)*12+4,1)}}ctx.fillStyle='#e0c79150';ctx.fillRect(0,337,W,2);ctx.fillRect(0,574,W,2)}
function homePads(t){gradient(0,0,W,48,'#214a4e','#123b46');for(let i=0;i<GOALS.length;i++){let x=GOALS[i];ellipse(x,25,37,20,'#081d30');ellipse(x,24,33,16,homes[i]?'#6bac4c':'#387b60');ellipse(x-6,19,20,8,homes[i]?'#c5eb7f':'#6bc18e');ctx.strokeStyle='#e0ffd173';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,24,31,.2,Math.PI*1.75);ctx.stroke();if(homes[i])drawFrog(x,24,.56,t,false);else{ellipse(x,23,7,6,'#f1bcca');ellipse(x+1,22,3,3,'#ffdbef')}}text('HOME',W-10,10,8,'#a1d7bf','right')}
function drawLog(x,y,len,t){ctx.save();ctx.translate(x,y);rounded(0,8,len,32,14,'#422c23');rounded(2,5,len-4,29,12,'#895438','#bc8051');rounded(7,7,len-15,9,5,'#d79c65');rounded(9,21,len-19,8,4,'#6e3c2a');ctx.strokeStyle='#5e3325';ctx.lineWidth=1.8;for(let i=22;i<len-10;i+=24){ctx.beginPath();ctx.moveTo(i,9);ctx.bezierCurveTo(i-8,17,i+7,22,i,32);ctx.stroke()}ctx.strokeStyle='#e5b47b80';ctx.lineWidth=1;for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(17+j*4,11+j*6);ctx.lineTo(len-16,11+j*6);ctx.stroke()}ellipse(8,20,6,12,'#bb8556');ellipse(len-9,20,6,12,'#bc7c4f');ellipse(len-9,20,3,7,'#7f5136');ctx.strokeStyle='#e3ffff30';ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(len/2,36,Math.max(17,len*.38),4,0,0,Math.PI);ctx.stroke();ctx.restore()}
function drawTurtles(x,y,len,t){ctx.save();ctx.translate(x,y);const n=Math.max(2,Math.round(len/43));for(let i=0;i<n;i++){const cx=20+i*(len-40)/(n-1),bob=Math.sin(t*3+i)*1.5;ellipse(cx,22+bob,21,14,'#13454b');ellipse(cx-13,22+bob,5,5,'#82c79c');ellipse(cx+15,21+bob,7,6,'#83cf9f');ellipse(cx,20+bob,19,13,'#426e49');ellipse(cx-3,16+bob,13,7,'#8caa5a');ctx.strokeStyle='#274e3c';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(cx-9,11+bob);ctx.lineTo(cx+2,27+bob);ctx.moveTo(cx+10,12+bob);ctx.lineTo(cx-5,26+bob);ctx.stroke();ellipse(cx+17,18+bob,1.6,1.6,'#0c3533')}ctx.restore()}
function drawVehicle(x,y,len,type,color){ctx.save();ctx.translate(x,y);const h=type==='truck'?31:type==='van'?30:26,cy=(CELL-h)/2;rounded(4,cy+7,len,h,7,'#0006');for(const wx of [11,len-16]){rounded(wx,cy-2,12,8,3,'#10181f');rounded(wx,cy+h-6,12,8,3,'#10181f');ellipse(wx+6,cy+2,2,2,'#829199');ellipse(wx+6,cy+h-2,2,2,'#829199')}
rounded(1,cy,len-2,h,7,color,'#ffffff60');rounded(6,cy+3,len-13,5,2,'#ffffff41');if(type==='car'){rounded(len*.27,cy+5,len*.44,h-10,6,'#204653');rounded(len*.30,cy+7,len*.17,h-14,3,'#9adee5');rounded(len*.51,cy+7,len*.17,h-14,3,'#74b8cb');ctx.fillStyle='#193640';ctx.fillRect(len*.485,cy+6,2,h-12)}else if(type==='van'){rounded(len*.19,cy+5,len*.63,h-10,4,'#295464');for(let j=0;j<3;j++)rounded(len*.23+j*22,cy+7,18,h-14,3,'#8dd4e0');ctx.fillStyle='#f0e9d2';ctx.fillRect(5,cy+18,len-10,2)}else{rounded(6,cy+5,len*.29,h-10,4,'#9bcdd8');rounded(len*.37,cy+3,len*.58,h-6,4,'#ffffff24');for(let j=0;j<3;j++)ctx.fillRect(len*.48+j*20,cy+7,1,h-12)}for(const p of [4,len-8]){rounded(p,cy+7,4,5,1,'#ffe9a3');rounded(p,cy+h-12,4,5,1,'#ff7774')}ctx.restore()}
function drawFrog(x,y,scale,t,hopAnim=true){ctx.save();ctx.translate(x,y-(hopAnim?Math.sin((.16-hop)/.16*Math.PI)*hop*64:0));ctx.scale(scale,scale);ellipse(1,13,20,6,'#061d2580');for(const side of [-1,1]){ellipse(side*14,8,9,7,'#539b4d');ellipse(side*15,12,7,4,'#9dd474');ellipse(side*18,-6,7,6,'#4d9d4b')}const g=ctx.createRadialGradient(-6,-10,2,0,0,22);g.addColorStop(0,'#d5f58b');g.addColorStop(.55,'#84ce62');g.addColorStop(1,'#3d9453');ellipse(0,0,18,17,g);ellipse(-6,-10,7,6,'#a8ec75');ellipse(8,-10,7,6,'#a8ec75');ellipse(-7,-11,4,5,'#faffef');ellipse(8,-11,4,5,'#faffef');ellipse(-6,-11,2,3,'#133c35');ellipse(9,-11,2,3,'#133c35');ellipse(-5,-12,1,1.4,'#fff');ellipse(10,-12,1,1.4,'#fff');ctx.strokeStyle='#276d4b';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(1,2,7,.25,Math.PI-.25);ctx.stroke();ellipse(-8,1,2,1.2,'#e7aa91');ellipse(10,1,2,1.2,'#e7aa91');ctx.restore()}
function render(t){ctx.clearRect(0,0,W,H);homePads(t);drawWater(t);grass(6,t);drawRoad();grass(12,t);for(const lane of lanes){for(const o of lane.objects){if(o.x>W+10||o.x+lane.len< -10)continue;const y=lane.row*CELL;if(lane.type==='log')drawLog(o.x,y,lane.len,t);else if(lane.type==='turtle')drawTurtles(o.x,y,lane.len,t);else drawVehicle(o.x,y,lane.len,lane.type,lane.color)}}if(state!=='over'||lives>0)drawFrog(frog.x,frog.row*CELL+24,1,t,true);for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ellipse(p.x,p.y,p.size,p.size,p.color)}ctx.globalAlpha=1;ctx.strokeStyle='#d1fbe035';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2)}
function frame(ts){const dt=Math.min(.04,Math.max(0,(ts-last)/1000||0));last=ts;advance(dt);render(ts/1000);requestAnimationFrame(frame)}
const directionKeys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right',W:'up',A:'left',S:'down',D:'right'};
window.addEventListener('keydown',e=>{if(directionKeys[e.key]){e.preventDefault();step(directionKeys[e.key])}else if(e.key==='p'||e.key==='P'||e.key===' '){e.preventDefault();pause()}},{passive:false});
let touch=null;canvas.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!touch||e.pointerId!==touch.id)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;step(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});canvas.addEventListener('pointercancel',()=>{touch=null});
for(const b of document.querySelectorAll('[data-dir]')){b.addEventListener('click',()=>step(b.dataset.dir));b.addEventListener('pointerdown',()=>b.classList.add('pressed'));for(const type of ['pointerup','pointerleave','pointercancel'])b.addEventListener(type,()=>b.classList.remove('pressed'))}
$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});
setupLanes();hud();resize();els.action.onclick=begin;requestAnimationFrame(frame);
})();
</script>
