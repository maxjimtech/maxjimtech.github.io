<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ICBM 城市防禦 — 經典獨立版</title>
<style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;color:#fff;font-family:'Courier New',monospace}body{display:flex;align-items:center;justify-content:center}#wrap{position:relative;width:min(100vw,1200px);aspect-ratio:16/10;max-height:100vh}canvas{display:block;width:100%;height:100%;background:#02030a;border:2px solid #1d3150;touch-action:none;cursor:crosshair}#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,0,0,.15) 4px)}</style></head>
<body><div id="wrap"><canvas id="game" width="960" height="600"></canvas><div id="scan"></div></div>
<script>(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=960,H=600,GROUND=530;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),distance=(x,y,a,b)=>Math.hypot(x-a,y-b);
let state='title',last=0,elapsed=0,score=0,highScore=0,wave=1,nextBonusCity=10000,spawnCount=0,spawnTotal=0,spawnTimer=0,spawnInterval=1,waveMessageTimer=0,bonusApplied=false,mouseX=480,mouseY=220,pointerInside=false;
let enemies=[],interceptors=[],explosions=[],particles=[],debris=[],cities=[],bases=[],audio=null;
try{highScore=Number(localStorage.getItem('icbmHighScore')||0)}catch(e){}
const stars=Array.from({length:110},()=>({x:rand(0,W),y:rand(0,430),r:Math.random()<.8?1:1.5,a:rand(.25,.9)}));
function initAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function beep(f=400,t=.08,v=.025,type='square'){if(!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+t);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+t)}catch(e){}}
function buildObjects(){cities=[185,275,365,595,685,775].map(x=>({x,y:GROUND,alive:true}));bases=[75,480,885].map(x=>({x,y:GROUND,alive:true,ammo:10}))}
function livingCities(){return cities.filter(c=>c.alive)}function targets(){return [...livingCities(),...bases.filter(b=>b.alive)]}
function particlesAt(x,y,n,color,speed=100){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(0,speed),life=rand(.3,1);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,maxLife:life,color,size:rand(1,3)})}}
function addScore(points){score+=points;if(score>highScore){highScore=score;try{localStorage.setItem('icbmHighScore',highScore)}catch(e){}}while(score>=nextBonusCity){const destroyed=cities.filter(c=>!c.alive);if(destroyed.length){const c=destroyed[Math.floor(rand(0,destroyed.length))];c.alive=true;particlesAt(c.x,c.y-15,45,'#66ffff',130);beep(1100,.25,.04,'sine')}nextBonusCity+=10000}}
function startWave(){state='playing';spawnCount=0;spawnTotal=8+wave*3+Math.floor(wave*.7);spawnInterval=Math.max(.28,1.10-wave*.055);spawnTimer=.7;enemies=[];interceptors=[];explosions=[];for(const b of bases){b.alive=true;b.ammo=10}waveMessageTimer=2.2;bonusApplied=false;beep(400+wave*20,.12,.03)}
function reset(){score=0;wave=1;nextBonusCity=10000;enemies=[];interceptors=[];explosions=[];particles=[];debris=[];elapsed=0;buildObjects();startWave()}
function enemyFrom(x,y,target,multiplier=1,allowSplit=true){const speed=(42+wave*5.2+rand(0,10))*multiplier;enemies.push({x,y,tx:target.x+rand(-12,12),ty:GROUND-2,target,speed,alive:true,trail:[],willSplit:allowSplit&&wave>=3&&Math.random()<Math.min(.38,.06+wave*.025),splitY:rand(150,300),color:Math.random()<.12?'#ff66ff':'#ff3c30'})}
function spawnEnemy(){const pool=targets();if(pool.length)enemyFrom(rand(40,W-40),-10,pool[Math.floor(rand(0,pool.length))])}
function fire(x,y){if(state!=='playing')return;const yy=clamp(y,40,GROUND-25);let best=null,bestDist=Infinity;for(const b of bases){if(!b.alive||b.ammo<=0)continue;const d=distance(b.x,b.y,x,yy);if(d<bestDist){best=b;bestDist=d}}if(!best){beep(120,.08,.02);return}best.ammo--;interceptors.push({x:best.x,y:best.y-20,tx:x,ty:yy,speed:455,alive:true,trail:[]});beep(520,.05,.025)}
function explosion(x,y,max=68,friendly=true,chain=false){explosions.push({x,y,r:2,max,phase:'grow',hold:0,friendly,chain,dead:false});beep(95,.16,.05,'sawtooth')}
function groundHit(target){if(!target||!target.alive)return;target.alive=false;explosion(target.x,GROUND-8,27,false);particlesAt(target.x,GROUND-15,55,'#ff8c00',150);for(let i=0;i<12;i++)debris.push({x:target.x+rand(-15,15),y:GROUND-rand(5,20),vx:rand(-60,60),vy:rand(-130,-30),rot:rand(0,7),vr:rand(-5,5),life:rand(1.2,2.5)});beep(60,.4,.08,'sawtooth')}
function updateEnemies(dt){for(const m of enemies){if(!m.alive)continue;if(m.willSplit&&m.y>=m.splitY){m.alive=false;const pool=targets();for(let i=0;i<(wave>=8?3:2)&&pool.length;i++)enemyFrom(m.x,m.y,pool[Math.floor(rand(0,pool.length))],1.1,false);particlesAt(m.x,m.y,14,'#ff66ff',80);beep(900,.05,.025);continue}const dx=m.tx-m.x,dy=m.ty-m.y,len=Math.hypot(dx,dy);if(len<4){m.alive=false;groundHit(m.target);continue}const step=Math.min(len,m.speed*dt);m.x+=dx/len*step;m.y+=dy/len*step;m.trail.push({x:m.x,y:m.y});if(m.trail.length>35)m.trail.shift();if(step>=len-1e-5){m.alive=false;groundHit(m.target);continue}for(const e of explosions){if(e.dead||!e.friendly)continue;if(distance(m.x,m.y,e.x,e.y)<=e.r){m.alive=false;addScore(m.willSplit?50:25);explosion(m.x,m.y,28,true,true);particlesAt(m.x,m.y,18,'#ffff66',95);beep(760,.04,.025);break}}}enemies=enemies.filter(m=>m.alive)}
function updateInterceptors(dt){for(const m of interceptors){const dx=m.tx-m.x,dy=m.ty-m.y,len=Math.hypot(dx,dy);if(len<8){m.alive=false;explosion(m.tx,m.ty);continue}const step=Math.min(len,m.speed*dt);m.x+=dx/len*step;m.y+=dy/len*step;m.trail.push({x:m.x,y:m.y});if(m.trail.length>24)m.trail.shift();if(step>=len-1e-5){m.alive=false;explosion(m.tx,m.ty)}}interceptors=interceptors.filter(m=>m.alive)}
function updateExplosions(dt){for(const e of explosions){if(e.phase==='grow'){e.r+=95*dt;if(e.r>=e.max){e.r=e.max;e.phase='hold';e.hold=e.chain?.08:.23}}else if(e.phase==='hold'){e.hold-=dt;if(e.hold<=0)e.phase='shrink'}else{e.r-=(e.friendly?55:45)*dt;if(e.r<=0)e.dead=true}}explosions=explosions.filter(e=>!e.dead)}
function updateParticles(dt){for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=55*dt;p.vx*=Math.pow(.97,dt*60)}particles=particles.filter(p=>p.life>0);for(const d of debris){d.life-=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=210*dt;d.rot+=d.vr*dt;if(d.y>=GROUND-2){d.y=GROUND-2;d.vy*=-.25;d.vx*=.65}}debris=debris.filter(d=>d.life>0)}
function spawnStep(dt){if(spawnCount<spawnTotal){spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy();spawnCount++;spawnTimer=spawnInterval*rand(.65,1.3);if(wave>=5&&Math.random()<.18&&spawnCount<spawnTotal){spawnEnemy();spawnCount++}}}if(spawnCount>=spawnTotal&&!enemies.length&&!interceptors.length){state='waveComplete';waveMessageTimer=2.8;bonusApplied=false}}
function update(dt){if(state==='playing'){elapsed+=dt;waveMessageTimer=Math.max(0,waveMessageTimer-dt);spawnStep(dt);updateInterceptors(dt);updateExplosions(dt);updateEnemies(dt);updateParticles(dt);if(!livingCities().length&&enemies.length===0){state='gameOver';beep(55,1,.08,'sawtooth')}}else if(state==='waveComplete'){updateExplosions(dt);updateParticles(dt);if(!bonusApplied){bonusApplied=true;addScore(livingCities().length*100+bases.reduce((n,b)=>n+(b.alive?b.ammo:0),0)*5);beep(1000,.15,.03,'sine')}waveMessageTimer-=dt;if(waveMessageTimer<=0){if(!livingCities().length)state='gameOver';else{wave++;startWave()}}}else if(state==='gameOver'){updateExplosions(dt);updateParticles(dt)}}
function background(){const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#020310');gr.addColorStop(.7,'#071126');gr.addColorStop(1,'#131020');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a*(.7+.3*Math.sin(elapsed*2+s.x));ctx.fillStyle='#d9f0ff';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;ctx.fillStyle='#1c2430';ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle='#273447';ctx.fillRect(0,GROUND,W,3)}
function drawCity(city){const x=city.x,y=city.y;if(!city.alive){ctx.fillStyle='#381d17';ctx.fillRect(x-22,y-6,44,6);ctx.fillStyle='#56291f';ctx.fillRect(x-16,y-10,8,4);ctx.fillRect(x+5,y-13,11,7);return}const buildings=[[-27,-24,13,24],[-13,-36,15,36],[4,-27,11,27],[17,-42,13,42],[32,-20,9,20]];for(let i=0;i<buildings.length;i++){const b=buildings[i];ctx.fillStyle=i%2?'#6bc8f2':'#4ba3d8';ctx.fillRect(x+b[0],y+b[1],b[2],b[3]);ctx.fillStyle='#ffe56d';for(let yy=y+b[1]+5;yy<y-4;yy+=7){ctx.fillRect(x+b[0]+3,yy,2,2);if(b[2]>10)ctx.fillRect(x+b[0]+b[2]-5,yy,2,2)}}}
function drawBase(b){const x=b.x,y=b.y;if(!b.alive){ctx.fillStyle='#542318';ctx.beginPath();ctx.moveTo(x-30,y);ctx.lineTo(x-15,y-10);ctx.lineTo(x+18,y-5);ctx.lineTo(x+28,y);ctx.closePath();ctx.fill();return}ctx.fillStyle='#777e8a';ctx.beginPath();ctx.moveTo(x-35,y);ctx.lineTo(x-22,y-19);ctx.lineTo(x+22,y-19);ctx.lineTo(x+35,y);ctx.closePath();ctx.fill();ctx.fillStyle='#b9c6cf';ctx.fillRect(x-4,y-35,8,18);ctx.fillStyle='#ffdf5d';ctx.beginPath();ctx.moveTo(x,y-43);ctx.lineTo(x-5,y-34);ctx.lineTo(x+5,y-34);ctx.closePath();ctx.fill();for(let i=0;i<b.ammo;i++){ctx.fillStyle='#61ff8d';ctx.fillRect(x-15+(i%5)*7,y+8+Math.floor(i/5)*7,4,5)}}
function drawMissiles(){ctx.lineWidth=1.4;for(const m of enemies){if(m.trail.length>1){const f=m.trail[0],gr=ctx.createLinearGradient(f.x,f.y,m.x,m.y);gr.addColorStop(0,'rgba(255,70,40,.05)');gr.addColorStop(1,m.color);ctx.strokeStyle=gr;ctx.beginPath();ctx.moveTo(f.x,f.y);for(let i=1;i<m.trail.length;i++)ctx.lineTo(m.trail[i].x,m.trail[i].y);ctx.stroke()}ctx.fillStyle='#fff6dd';ctx.fillRect(m.x-1.5,m.y-1.5,3,3)}for(const m of interceptors){if(m.trail.length>1){ctx.strokeStyle='#7ffcff';ctx.beginPath();ctx.moveTo(m.trail[0].x,m.trail[0].y);for(let i=1;i<m.trail.length;i++)ctx.lineTo(m.trail[i].x,m.trail[i].y);ctx.stroke()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(m.x,m.y,2.5,0,Math.PI*2);ctx.fill()}}
function drawExplosions(){for(const e of explosions){if(e.friendly){const gr=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.18,'rgba(255,255,100,.95)');gr.addColorStop(.5,'rgba(255,130,20,.7)');gr.addColorStop(.78,'rgba(255,50,20,.42)');gr.addColorStop(1,'rgba(255,40,20,0)');ctx.fillStyle=gr}else ctx.fillStyle='rgba(255,65,20,.65)';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();if(e.friendly){ctx.strokeStyle='rgba(255,245,150,.65)';ctx.lineWidth=2;ctx.stroke()}}}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;ctx.fillStyle='#8f4a31';for(const d of debris){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.fillRect(-3,-2,6,4);ctx.restore()}}
function center(text,y,size,color='#fff'){ctx.textAlign='center';ctx.font=`bold ${size}px Courier New`;ctx.fillStyle=color;ctx.fillText(text,W/2,y)}
function hud(){ctx.font='bold 18px Courier New';ctx.textAlign='left';ctx.fillStyle='#73f6ff';ctx.fillText('SCORE '+String(score).padStart(6,'0'),20,28);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('WAVE '+wave,W/2,28);ctx.textAlign='right';ctx.fillStyle='#ffd75c';ctx.fillText('HIGH '+String(highScore).padStart(6,'0'),W-20,28);ctx.font='14px Courier New';ctx.textAlign='left';ctx.fillStyle='#9fb2c9';ctx.fillText('CITY '+livingCities().length+'/6',20,51);ctx.textAlign='right';ctx.fillText('ICBM '+spawnCount+'/'+spawnTotal,W-20,51)}
function title(){ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(0,0,W,H);center('ICBM',180,82,'#ff5a46');center('CITY DEFENSE',235,38,'#71f4ff');center('城市防禦指揮系統',285,21);center('點擊天空發射攔截飛彈',350,17,'#ffd966');center('利用爆炸連鎖摧毀來襲 ICBM',380,15,'#a9bdd4');center('點擊畫面 / SPACE 開始',450,20,'#61ff8d');center('P 暫停   R 重新開始',485,13,'#8496ad')}
function draw(){background();drawMissiles();drawExplosions();for(const c of cities)drawCity(c);for(const b of bases)drawBase(b);drawParticles();if(state!=='title')hud();if(state==='playing'&&waveMessageTimer>0){ctx.globalAlpha=Math.min(1,waveMessageTimer);center('WAVE '+wave,120,34);center('敵方 ICBM '+spawnTotal,150,14,'#ff9687');ctx.globalAlpha=1}if(state==='waveComplete'){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,80,W,115);center('WAVE '+wave+' COMPLETE',125,30,'#61ff8d');center('CITY BONUS '+livingCities().length*100,157,15);center('MISSILE BONUS '+bases.reduce((n,b)=>n+(b.alive?b.ammo:0),0)*5,180,15,'#ffd75c')}if(pointerInside&&state==='playing'){ctx.strokeStyle='rgba(100,255,255,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(mouseX,mouseY,10,0,Math.PI*2);ctx.moveTo(mouseX-16,mouseY);ctx.lineTo(mouseX-5,mouseY);ctx.moveTo(mouseX+5,mouseY);ctx.lineTo(mouseX+16,mouseY);ctx.moveTo(mouseX,mouseY-16);ctx.lineTo(mouseX,mouseY-5);ctx.moveTo(mouseX,mouseY+5);ctx.lineTo(mouseX,mouseY+16);ctx.stroke()}if(state==='title')title();if(state==='paused'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);center('PAUSED',285,46);center('按 P 繼續',330,18,'#73f6ff')}if(state==='gameOver'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);center('CITY DEFENSE FAILED',235,38,'#ff4938');center('最終分數 '+score,300,25);center('最高分 '+highScore,335,17,'#ffd75c');center('點擊畫面或按 R 重新開始',410,18,'#73f6ff')}}
function coords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}canvas.addEventListener('pointermove',e=>{const p=coords(e);mouseX=p.x;mouseY=p.y;pointerInside=true});canvas.addEventListener('pointerleave',()=>pointerInside=false);canvas.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();const p=coords(e);mouseX=p.x;mouseY=p.y;if(state==='title'||state==='gameOver')reset();else if(state==='playing')fire(p.x,p.y)});window.addEventListener('keydown',e=>{if(e.code==='Space')e.preventDefault();initAudio();if(e.code==='Space'&&state==='title')reset();else if(e.key.toLowerCase()==='p'){if(state==='playing')state='paused';else if(state==='paused')state='playing'}else if(e.key.toLowerCase()==='r')reset()});
function loop(time){if(!last)last=time;const dt=Math.min((time-last)/1000,.033);last=time;if(state!=='paused'&&state!=='title')update(dt);draw();requestAnimationFrame(loop)}buildObjects();requestAnimationFrame(loop);
})();</script></body></html>
