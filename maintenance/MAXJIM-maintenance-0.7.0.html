(function(g){'use strict';
const collections=['customers','machines','orders','entries','parts','moves','plans','quotes','payments','techs','daily','audit'];
const fail=c=>{throw Error(c)},id=()=>crypto.randomUUID(),now=()=>new Date().toISOString();
function blank(){return {schema:1,revision:0,settings:{company:'MAXJIM',address:'',contact:''},...Object.fromEntries(collections.map(k=>[k,[]]))}}
function cents(v){const s=String(v).trim();if(!/^\d{1,9}(\.\d{1,2})?$/.test(s))fail('money');let [a,b='']=s.split('.');return Number(a)*100+Number(b.padEnd(2,'0'))}
function totals(lines,discount='0',tax='0'){if(!Array.isArray(lines)||!lines.length||lines.length>100)fail('lines');let sub=0;for(const l of lines){if(!l.description||!Number.isInteger(l.qty)||l.qty<1||l.qty>100000)fail('lines');sub+=cents(l.price)*l.qty}let d=cents(discount);if(d>sub)fail('discount');if(!/^\d{1,2}(\.\d{1,2})?$/.test(String(tax))||+tax>25)fail('tax');const base=sub-d,t=Math.round(base*cents(tax)/10000),total=base+t;if(!Number.isSafeInteger(total)||total>99999999999999)fail('money');return {subtotal:sub,discount:d,tax:t,total}}
const find=(s,k,x)=>s[k].find(v=>v.id===x)||fail('reference');
function audit(s,action,entity){s.audit.push({id:id(),at:now(),action,entity});if(s.audit.length>20000)fail('limit')}
function add(s,k,record){if(!collections.includes(k)||k==='audit')fail('schema');if(k==='customers'&&s.customers.length>=200)fail('customers200');if(s[k].length>=20000)fail('limit');const r={...record,id:id(),createdAt:now()};s[k].push(r);audit(s,'create:'+k,r.id);return r}
function closeOrder(s,oid,proof){const o=find(s,'orders',oid);if(o.status==='closed')fail('closed');if(!proof.isolation||!proof.interlock||!proof.test||!proof.reviewer?.trim()||!proof.result?.trim())fail('safety');if(!s.entries.some(e=>e.orderId===oid))fail('entry');o.acceptance={...proof,at:now()};o.status='closed';o.closedAt=now();for(const p of s.plans.filter(p=>p.orderId===oid)){p.lastDone=o.closedAt;p.orderId='';let date=new Date(o.closedAt);date.setUTCDate(date.getUTCDate()+Number(p.interval));p.next=date.toISOString().slice(0,10)}audit(s,'close',oid)}
function quote(s,oid,currency,lines,discount,tax,terms){const o=find(s,'orders',oid),m=find(s,'machines',o.machineId),c=find(s,'customers',m.customerId);if(!['TWD','THB','USD'].includes(currency))fail('currency');const total=totals(lines,discount,tax);return add(s,'quotes',{number:'Q-'+String(s.quotes.length+1).padStart(5,'0'),orderId:oid,currency,lines:structuredClone(lines),discount,taxRate:tax,...total,terms,status:'draft',publicCustomer:{name:c.name,thai:c.thai||'',address:c.address||'',contact:c.contact||''},publicMachine:{name:m.name,serial:m.serial},company:structuredClone(s.settings)})}
function approve(s,qid,reviewer){let q=find(s,'quotes',qid);if(q.status!=='draft'||!reviewer?.trim())fail('approval');q.status='approved';q.approver=reviewer;q.approvedAt=now();audit(s,'approve',qid)}
function accept(s,qid,evidence){const q=find(s,'quotes',qid);if(q.status!=='approved'||!evidence?.trim())fail('approval');q.status='accepted';q.acceptance=evidence;q.acceptedAt=now();audit(s,'accept',qid)}
function invoice(s,qid){let q=find(s,'quotes',qid);if(q.status!=='accepted')fail('approval');if(find(s,'orders',q.orderId).status!=='closed')fail('safety');if(s.quotes.some(x=>x.orderId===q.orderId&&x.status==='invoiced'))fail('duplicate');q.status='invoiced';q.invoiceNumber='B-'+String(s.quotes.filter(x=>x.status==='invoiced').length).padStart(5,'0');q.invoicedAt=now();audit(s,'invoice',qid)}
const paid=(s,qid)=>s.payments.filter(p=>p.quoteId===qid).reduce((a,p)=>a+p.amount,0);

const $=s=>document.querySelector(s),h=(tag,text)=>{let e=document.createElement(tag);e.textContent=text;return e},money=(n,c)=>new Intl.NumberFormat(lang==='th'?'th-TH':'zh-TW',{style:'currency',currency:c}).format(n/100),dt=v=>v?new Date(v).toLocaleString(lang==='th'?'th-TH':'zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—',btn=(act,label,data='',cls='')=>`<button type="button" class="${cls}" data-act="${act}" data-id="${esc(data)}">${esc(t(label))}</button>`;
function message(s,bad=false){$('#message').textContent=s;$('#message').className=bad?'notice error':'notice success'}

const dbName=()=>demo?'maxjim-online-demo-v1':'maxjim-online-workspace-v1';
async function openDB(){if(db)db.close();db=await new Promise((ok,no)=>{let r=indexedDB.open(dbName(),1);r.onupgradeneeded=()=>r.result.createObjectStore('workspace');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(Error('storage'))});state=await readDB()||D.blank();ready=true;render()}
async function readDB(){return new Promise((ok,no)=>{let tx=db.transaction('workspace','readonly'),r=tx.objectStore('workspace').get('state');r.onsuccess=()=>{const value=r.result;if(value&&value.daily===undefined)value.daily=[];ok(value)};r.onerror=()=>no(Error('storage'))})}
async function commit(action,fn){if(dirty||!ready)return;dirty=true;try{const expected=state.revision,next=structuredClone(state);fn(next);D.validate(next);if(new TextEncoder().encode(JSON.stringify(next)).length>70*1024*1024)throw Error('limit');next.revision=expected+1;await new Promise((ok,no)=>{let tx=db.transaction('workspace','readwrite'),store=tx.objectStore('workspace'),r=store.get('state'),conflict=false;r.onsuccess=()=>{if((r.result?.revision||0)!==expected){conflict=true;tx.abort();return}store.put(next,'state')};tx.oncomplete=ok;tx.onabort=()=>no(Error(conflict?'conflict':'storage'));tx.onerror=()=>no(Error('storage'))});state=next;proposal=null;render();message(t('saved'));return true}catch(e){if(e.message==='conflict'){state=await readDB()||D.blank();render()}error(e);return false}finally{dirty=false}}
const opt=(value,label)=>`<option value="${esc(value)}">${esc(label)}</option>`;
function options(k){return state[k].map(x=>[x.id,(lang==='th'&&x.thai?x.thai:x.name||x.title||x.number)+' '+(x.serial||'')])}
const specs={customers:[['name','text',true],['thai','text'],['contact','text'],['address','textarea'],['note','textarea']],machines:[['customerId','select',true,'customers'],['name','text',true],['serial','text',true],['type','select',true,[['press','press'],['rubber','rubber'],['lsr','lsr']]],['note','textarea']],orders:[['machineId','select',true,'machines'],['title','text',true],['priority','select',true,[['1','1'],['2','2'],['3','3'],['4','4']]],['skill','select',true,[['general','general'],['hydraulic','hydraulic'],['electrical','electrical'],['mechanical','mechanical'],['injection','injection']]],['assignee','select',false,'techs'],['status','select',true,[['open','open'],['working','working'],['waiting','waiting']]],['symptom','textarea',true],['note','textarea']],parts:[['name','text',true],['sku','text',true],['minimum','number',true],['note','textarea']],plans:[['machineId','select',true,'machines'],['title','text',true],['next','date',true],['interval','number',true],['note','textarea']],techs:[['name','text',true],['slots','number',true],['skills','checks',true,['general','hydraulic','electrical','mechanical','injection']],['contact','text'],['note','textarea']]};
Object.assign(pairs,{brand:['品牌／型號','ยี่ห้อ / รุ่น'],year:['出廠年份','ปีผลิต'],tonnage:['合模噸數／額定規格','แรงปิด / สเปกพิกัด'],manual:['原廠手冊版本／公司檔案位置','รุ่นคู่มือ / ตำแหน่งไฟล์บริษัท'],oil:['油位／油溫／污染與洩漏','ระดับ อุณหภูมิ ปนเปื้อนและรั่วน้ำมัน'],pressure:['壓力設定／實測／單位','แรงดันตั้ง / วัด / หน่วย'],heat:['各區溫度設定／實測／硫化時間','อุณหภูมิตั้ง/วัดแต่ละโซน และเวลาวัลคาไนซ์'],plc:['警報／I/O／程式備份版本','สัญญาณเตือน / I/O / รุ่นสำรองโปรแกรม'],clamp:['導柱／合模平行度／頂出／潤滑','เสานำ / ความขนาน / กระทุ้ง / หล่อลื่น'],feed:['塑化／螺桿／噴嘴／冷流道','พลาสติไซซ์ / สกรู / หัวฉีด / ทางวิ่งเย็น'],ratio:['LSR A/B 批號／計量比設定與實測／混合器','LSR ล็อต A/B / อัตราจ่ายตั้งและวัด / เครื่องผสม'],water:['氣源／冷卻進出溫／流量／真空','ลม / อุณหภูมิน้ำเข้าออก / อัตราไหล / สุญญากาศ']});

const label=k=>t(({customerId:'customer',machineId:'machine',tax:'taxRate',orderId:'orders'})[k]||k);
function field(f,value){const [key,type,required,opts]=f,id='f-'+key;value=value??(key==='priority'?'2':key==='interval'?'30':key==='slots'?'1':key==='minimum'?'0':'');let body='';if(type==='select'){let list=typeof opts==='string'?options(opts):opts.map(([v,l])=>[v,t(l)]);body=`<select id="${id}" name="${key}" ${required?'required':''}>${required?'':opt('',t('none'))}${list.map(([v,l])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`}else if(type==='checks'){body=`<fieldset><legend>${label(key)}</legend>${opts.map(k=>`<label class="check"><input type="checkbox" name="${key}" value="${k}" ${(value||[]).includes(k)?'checked':''}>${t(k)}</label>`).join('')}</fieldset>`}else if(type==='textarea')body=`<textarea id="${id}" name="${key}" ${required?'required':''} maxlength="20000">${esc(value)}</textarea>`;else if(type==='checkbox')body=`<input id="${id}" name="${key}" type="checkbox" required>`;else body=`<input id="${id}" name="${key}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="1"':''} maxlength="500">`;return type==='checks'?body:`<label class="field" for="${id}"><span>${esc(label(key))}${required?' *':''}</span>${body}</label>`}
function form(title,fields,values,handler,extra=''){const d=$('#dialog');d.classList.remove('daily-editor');d.innerHTML=`<form id="form"><header><h2>${esc(title)}</h2></header><div class="formbody">${extra}${fields.map(f=>field(f,values?.[f[0]])).join('')}<p id="form-error" class="error" role="alert"></p></div><footer>${btn('cancel','cancel')}<button type="submit" class="primary">${t('save')}</button></footer></form>`;d.showModal();$('#form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const data=new FormData(e.target),v=Object.fromEntries(data);for(const f of fields)if(f[1]==='checks')v[f[0]]=data.getAll(f[0]);try{const result=await handler(v,data);if(result!==false)d.close();else $('#form-error').textContent=$('#message').textContent}catch(err){$('#form-error').textContent=(errors[err.message]||[err.message,err.message])[lang==='th'?1:0]}finally{b.disabled=false}}}
function editEntity(k,rid=''){const old=rid?D.find(state,k,rid):null;if(k==='orders'&&old?.status==='closed')return error(Error('closed'));if(k==='customers'&&!rid&&state.customers.length>=200)return error(Error('customers200'));let fields=specs[k];if(k==='orders'&&old)fields=fields.filter(f=>f[0]!=='machineId');if(k==='machines'&&old)fields=fields.filter(f=>f[0]!=='customerId');form(t(rid?'edit':'add')+' · '+t(k),fields,old,async v=>{for(const f of fields)if(f[1]==='number')v[f[0]]=Number(v[f[0]]);if(k==='orders')v.priority=Number(v.priority);if(k==='techs'&&!v.skills.length)throw Error('schema');if(k==='plans'&&(!Number.isInteger(v.interval)||v.interval<1||v.interval>3650))throw Error('schema');return commit('edit',s=>{if(old){Object.assign(D.find(s,k,rid),v);D.audit(s,'edit:'+k,rid)}else{if(k==='parts')v.stock=0;if(k==='orders')v.number='WO-'+String(s.orders.length+1).padStart(5,'0');D.add(s,k,v)}})})}
function list(headers,rows){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${esc(t(x))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('empty')}</div>`}
const customerName=m=>{const c=state.customers.find(c=>c.id===m?.customerId);return c?(lang==='th'&&c.thai?c.thai:c.name):'—'},machineName=id=>state.machines.find(m=>m.id===id)?.name||'—',orderName=id=>state.orders.find(o=>o.id===id)?.number||'—';
let query='';const match=r=>!query||JSON.stringify(r).toLowerCase().includes(query.toLowerCase());
function render(){if(!ready)return;document.documentElement.lang=lang==='th'?'th':'zh-Hant';document.title='MAXJIM · '+t(page)+' · '+VERSION;$('#mode').textContent=t(demo?'demoMode':'local');$('#language').textContent=lang==='zh'?'ภาษาไทย':'繁體中文';$('#storage').textContent=t('storage');$('#nav').innerHTML=['dashboard','customers','machines','orders','parts','plans','techs','daily','quotes','reports','backup','audit'].map(k=>`<button data-act="nav" data-id="${k}" ${page===k?'aria-current="page"':''}>${t(k)}</button>`).join('');$('#title').textContent=t(page);$('#tools').innerHTML=(specs[page]&&!selected?btn('add','add',page,'primary'):'')+(page==='orders'&&!selected?'':page==='customers'?`<span>${state.customers.length} / 200</span>`:'');$('#searchlabel').textContent=t('search');$('#search').hidden=!['customers','machines','orders','parts','plans','quotes','techs','daily'].includes(page)||!!selected;$('#searchlabel').hidden=$('#search').hidden;$('#content').innerHTML=view();}
function view(){if(page==='daily')return DailyUI.view();if(page==='dashboard'){const active=state.orders.filter(x=>x.status!=='closed').length,due=state.plans.filter(p=>p.next<=new Date().toISOString().slice(0,10)).length;return `<div class="stats">${[['customers',state.customers.length+' / 200'],['machines',state.machines.length],['orders',active],['due',due]].map(([k,v])=>`<article><span>${t(k)}</span><strong>${v}</strong></article>`).join('')}</div><section class="panel"><h2>${t('instructions')}</h2><p>${t('help')}</p><p>${t('safetyNote')}</p>${btn('demo',demo?'real':'demo')} ${btn('nav','backup','backup')}</section><section class="panel"><h2>${t('orders')}</h2>${list(['title','machine','status','detail'],state.orders.filter(o=>o.status!=='closed').sort((a,b)=>a.priority-b.priority||a.createdAt.localeCompare(b.createdAt)).slice(0,10).map(o=>[esc(o.number+' '+o.title),esc(machineName(o.machineId)),`<span class="status ${o.status}">${t(o.status)}</span>`,btn('order','detail',o.id)]))}</section>`}
if(page==='customers')return list(['name','thai','contact','address','detail'],state.customers.filter(match).map(c=>[esc(c.name),esc(c.thai),esc(c.contact),esc(c.address),btn('edit','edit','customers:'+c.id)]));
if(page==='machines')return list(['name','serial','type','customer','detail'],state.machines.filter(match).map(m=>[esc(m.name),esc(m.serial),t(m.type),esc(customerName(m)),btn('edit','edit','machines:'+m.id)]));
if(page==='orders'){if(selected)return orderView(D.find(state,'orders',selected));return list(['title','machine','priority','assignee','status','detail'],state.orders.filter(match).sort((a,b)=>a.priority-b.priority||a.createdAt.localeCompare(b.createdAt)).map(o=>[esc(o.number+' '+o.title),esc(machineName(o.machineId)),o.priority,esc(state.techs.find(t=>t.id===o.assignee)?.name||t('none')),`<span class="status ${o.status}">${t(o.status)}</span>`,btn('order','detail',o.id)+(o.status!=='closed'?btn('edit','edit','orders:'+o.id):'')]))}
if(page==='parts')return list(['name','sku','stock','minimum','detail'],state.parts.filter(match).map(p=>[esc(p.name),esc(p.sku),`<span class="${p.stock<=p.minimum?'warn':''}">${p.stock}</span>`,p.minimum,btn('move','movement',p.id)+btn('edit','edit','parts:'+p.id)]))+`<h2>${t('movements')}</h2>`+list(['name','qty','reason','orders'],state.moves.slice(-50).reverse().map(m=>[esc(state.parts.find(p=>p.id===m.partId)?.name),m.qty,esc(m.reason),esc(orderName(m.orderId))]));
if(page==='plans')return `<p>${t('safetyNote')}</p>`+list(['title','machine','next','interval','detail'],state.plans.filter(match).map(p=>[esc(p.title),esc(machineName(p.machineId)),`<span class="${p.next<=new Date().toISOString().slice(0,10)?'warn':''}">${esc(p.next)}</span>`,p.interval,btn('edit','edit','plans:'+p.id)+(p.orderId?btn('order','detail',p.orderId):btn('generate','generate',p.id))]));
if(page==='techs')return `<p class="notice">${t('optimizerNote')}</p>`+list(['name','skills','slots','detail'],state.techs.filter(match).map(p=>[esc(p.name),p.skills.map(t).join(' / '),p.slots,btn('edit','edit','techs:'+p.id)]))+btn('optimize','optimize','','primary')+(proposal?`<section class="panel"><h2>${t('optimize')}</h2>${list(['orders','assignee'],proposal.assigned.map(a=>[esc(orderName(a.orderId)),esc(state.techs.find(t=>t.id===a.techId)?.name)]))}${proposal.unassigned.map(u=>`<p>${esc(orderName(u.orderId))}: ${t(u.reason==='capacity'?'capacity':'skillMissing')}</p>`).join('')}${proposal.assigned.length?btn('apply','apply','','primary'):''}</section>`:'');
if(page==='quotes')return list(['name','orders','status','total','balance','detail'],state.quotes.filter(match).slice().reverse().map(q=>[esc(q.invoiceNumber||q.number),esc(orderName(q.orderId)),`<span class="status ${q.status}">${t(q.status)}</span>`,money(q.total,q.currency),q.status==='invoiced'?money(q.total-D.paid(state,q.id),q.currency):'—',btn('preview','preview',q.id)+(q.status==='draft'?btn('approve','approve',q.id):q.status==='approved'?btn('accept','accept',q.id):q.status==='accepted'?btn('invoice','invoice',q.id):btn('payment','payment',q.id))]));
if(page==='reports'){const closed=state.orders.filter(o=>o.status==='closed').length,hours=state.entries.reduce((a,e)=>a+e.hours,0);return `<p>${t('reportNote')}</p><div class="stats"><article>${t('closed')}<strong>${closed}</strong></article><article>${t('hours')}<strong>${hours.toFixed(2)}</strong></article></div>`+list(['currency','total','paid','balance'],['TWD','THB','USD'].map(c=>{const qs=state.quotes.filter(q=>q.currency===c&&q.status==='invoiced'),sum=qs.reduce((a,q)=>a+q.total,0),p=qs.reduce((a,q)=>a+D.paid(state,q.id),0);return [c,money(sum,c),money(p,c),money(sum-p,c)]}))+`<h2>${t('machine')}</h2>`+list(['machine','orders','hours'],state.machines.map(m=>{const ids=state.orders.filter(o=>o.machineId===m.id).map(o=>o.id);return [esc(m.name),ids.length,state.entries.filter(e=>ids.includes(e.orderId)).reduce((a,e)=>a+e.hours,0).toFixed(2)]}))+btn('csv','exportCsv')}
if(page==='audit')return `<p>${t('noLogin')}</p>`+list(['arrival','action','reference'],state.audit.slice(-200).reverse().map(a=>[dt(a.at),esc(a.action),esc(a.entity)]));

async function importBackup(file){if(!file)return;if(file.size>80*1024*1024)throw Error('file');const bundle=JSON.parse(await file.text());if(bundle.format!=='maxjim-browser-backup'||bundle.version!==1||typeof bundle.payload!=='string')throw Error('schema');if(await hash(bundle.payload)!==bundle.sha256)throw Error('hash');if(new TextEncoder().encode(bundle.payload).length>70*1024*1024)throw Error('limit');const incoming=D.validate(JSON.parse(bundle.payload,(k,v)=>{if(['__proto__','constructor','prototype'].includes(k))throw Error('schema');return v}));form(t('restore'),[],{},async()=>commit('restore',s=>{const rev=s.revision;for(const k of Object.keys(s))delete s[k];Object.assign(s,structuredClone(incoming),{revision:rev});D.audit(s,'restore',bundle.exportedAt)}),`<p>${t('restoreNote')}</p><p>${t('customers')}: ${incoming.customers.length} / ${t('orders')}: ${incoming.orders.length} / ${t('quotes')}: ${incoming.quotes.length}</p><label class="check"><input type="checkbox" required> ${t('confirmRestore')}</label>`)}

const fieldMulti=(key,value,prefix)=>`<fieldset><legend>${t(key)}</legend>${[['th','ภาษาไทย'],['en','English'],['zh','中文']].map(([l,n])=>`<label class="field" for="${prefix}-${key}-${l}"><span>${n}</span><textarea id="${prefix}-${key}-${l}" data-multi="${key}" data-lang="${l}" maxlength="20000">${esc(value[l])}</textarea></label>`).join('')}</fieldset>`;
function view(){let rows=(state.daily||[]).filter(r=>R.search(r,state,query,from,to)).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));return `<p>${t('dailyHelp')}</p><p>${t('dailyRead')}</p><div class="actions">${btn('daily-new','dailyNew','','primary')}${btn('daily-photo','dailyPhoto')}</div><div class="daily-filters"><label>${t('dailyFrom')}<input type="date" id="daily-from" value="${esc(from)}"></label><label>${t('dailyTo')}<input type="date" id="daily-to" value="${esc(to)}"></label></div>${list(['dailyDate','prepared','project','status','detail'],rows.map(r=>[esc(r.date),esc(r.prepared),esc(r.project),t(r.confirmed?'dailyReady':'dailyDraft'),btn('daily-open','edit',r.id)+btn('daily-preview','dailyPreview',r.id)]))}<p class="notice">${t('dailyFormat')}</p><input type="file" id="daily-source-input" accept="image/jpeg,image/png,image/webp" hidden>`}
function sync(){if(!draft||!$('#daily-form'))return draft;const f=$('#daily-form');for(const k of ['date','prepared','project','leave','ocrText'])draft[k]=f.querySelector(`[name="${k}"]`).value;for(const k of ['summary','nextPlan'])for(const l of R.L)draft[k][l]=f.querySelector(`[data-report-multi="${k}"][data-lang="${l}"]`).value;f.querySelectorAll('[data-group]').forEach(section=>{const c=draft.groups[+section.dataset.group];for(const k of ['people','project','orderId'])c[k]=section.querySelector(`[name="${k}"]`).value;for(const k of ['task','done','waiting','plan'])for(const l of R.L)c[k][l]=section.querySelector(`[data-multi="${k}"][data-lang="${l}"]`).value});draft.confirmed=f.elements.confirmed.checked;return draft}
function editor(){const dialog=$('#dialog');dialog.classList.add('daily-editor');dialog.innerHTML=`<form id="daily-form"><header><h2>${t('daily')} · 1536 × 1024</h2></header><div class="formbody"><p>${t('dailyInternal')}</p><div class="daily-editor-grid"><aside class="daily-reference">${draft.source?`<label>${t('dailySourceLabel')}</label><img alt="${t('dailySourceLabel')}" src="${esc(draft.source.data)}"><div class="actions">${btn('daily-ocr','dailyOcr')}${btn('daily-stop','dailyCancelOcr')}${btn('daily-crop','dailyCrop')}</div>`:`<p>${t('dailyHelp')}</p>${btn('daily-select-source','dailyPhoto')}`}<p id="daily-progress" role="status"></p><p>${t('dailyFormat')}</p></aside><div class="daily-fields"><label class="field">${t('dailyDate')}<input name="date" type="date" value="${esc(draft.date)}" required></label><label class="field">${t('prepared')}<input name="prepared" value="${esc(draft.prepared)}" required maxlength="200"></label><label class="field">${t('project')}<input name="project" value="${esc(draft.project)}" maxlength="100"></label>${draft.groups.map((c,i)=>`<details class="daily-group" data-group="${i}" ${i===0?'open':''} style="--group-color:${R.palette[i]}"><summary>${i+1} · ${esc(c.people||t('people'))}</summary><label class="field">${t('people')}<input name="people" value="${esc(c.people)}" maxlength="200"></label><label class="field">${t('project')}<input name="project" value="${esc(c.project)}" maxlength="100"></label><label class="field">${t('orders')}<select name="orderId">${opt('',t('none'))}${state.orders.map(o=>`<option value="${esc(o.id)}" ${o.id===c.orderId?'selected':''}>${esc(o.number+' '+o.title)}</option>`).join('')}</select></label>${btn('daily-link','dailyLink',String(i))}${['task','done','waiting','plan'].map(k=>fieldMulti(k,c[k],'dg'+i)).join('')}<label class="field">${t('attachment')}<input type="file" data-group-photos="${i}" accept="image/png,image/jpeg,image/webp" multiple></label><div class="photos">${c.photos.map((p,j)=>`<div><img alt="${esc(p.name)}" src="${esc(p.data)}">${btn('daily-remove','dailyRemove',i+':'+j)}</div>`).join('')}</div></details>`).join('')}<label class="field">${t('leave')}<input name="leave" value="${esc(draft.leave)}" maxlength="2000"></label>${['summary','nextPlan'].map(k=>fieldMulti(k,draft[k],'report').replaceAll('data-multi=', 'data-report-multi=')).join('')}<label class="field">${t('dailyRaw')}<textarea name="ocrText" maxlength="100000">${esc(draft.ocrText)}</textarea></label><label class="check"><input name="confirmed" type="checkbox" ${draft.confirmed?'checked':''} required> ${t('dailyConfirmed')}</label><p id="daily-error" role="alert" class="error"></p></div></div><input type="file" id="daily-editor-source" accept="image/jpeg,image/png,image/webp" hidden></div><footer>${btn('daily-cancel','cancel')}${btn('daily-preview-draft','dailyPreview')}<button type="submit" class="primary">${t('save')}</button></footer></form>`;if(!dialog.open)dialog.showModal();$('#daily-form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{sync();if(!draft.confirmed)throw Error('dailyConfirm');R.validateReport(draft,state);const copy=structuredClone(draft);const result=await commit('daily',s=>{if(copy.id){const current=D.find(s,'daily',copy.id);Object.assign(current,copy);D.audit(s,'edit:daily',copy.id)}else D.add(s,'daily',copy)});if(result){await stop();dialog.close();dialog.classList.remove('daily-editor');draft=null}else $('#daily-error').textContent=$('#message').textContent}catch(err){showError(err)}finally{b.disabled=false}}}
function showError(err){console.error(err);const n=$('#daily-error')||$('#daily-progress');if(n)n.textContent=(errors[err.message]||errors.dailyOcr)[lang==='th'?1:0];else error(err)}
async function source(file,keep=false){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>8*1024*1024)throw Error('dailyImage');const data=await new Promise((ok,no)=>{let f=new FileReader;f.onload=()=>ok(f.result);f.onerror=()=>no(Error('dailyImage'));f.readAsDataURL(file)}),im=await C.image(data);if(im.width*im.height>25000000)throw Error('dailyImage');if(!keep)draft=R.blank();else sync();draft.source={name:file.name,data,width:im.width,height:im.height};draft.confirmed=false;editor();if(Math.abs(im.width/im.height-1.5)<0.01)await cropPhotos()}
async function cropPhotos(){sync();if(!draft.source)throw Error('dailyImage');const im=await C.image(draft.source.data),sx=im.width/1536,sy=im.height/1024;for(let i=0;i<5;i++){const x=15+i*307,y=242,w=284,h=i===4?133:348;const canvas=await C.crop(draft.source.data,x*sx,y*sy,w*sx,h*sy);let data=canvas.toDataURL('image/png');if(data.length>2800000)data=canvas.toDataURL('image/jpeg',0.92);if(data.length>2800000)throw Error('attachment');draft.groups[i].photos=[{name:'group-'+(i+1)+'.png',data}]}draft.confirmed=false;editor()}
async function stop(){ocrStopped=true;if(worker){const w=worker;worker=null;await w.terminate()}const b=$('#dialog [data-act="daily-ocr"]');if(b)b.disabled=ocrBusy}
function progress(text){const n=$('#daily-progress');if(n)n.textContent=text}
async function ocr(){if(ocrBusy)return;sync();if(!draft.source)throw Error('dailyImage');ocrBusy=true;ocrStopped=false;const button=$('#dialog [data-act="daily-ocr"]');if(button)button.disabled=true;progress(t('dailyWorking'));const chunks=[];let timer;try{timer=setTimeout(()=>{if(ocrBusy){stop();showError(Error('dailyOcr'))}},180000);worker=await Tesseract.createWorker(['eng','tha','chi_sim','chi_tra'],1,{workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0',logger:m=>{if(!ocrStopped)progress(t('dailyWorking')+' '+m.status+' '+Math.round((m.progress||0)*100)+'%')},errorHandler:e=>{console.error(e)}});if(ocrStopped){if(worker)await worker.terminate();worker=null;return}
/* Explicit language package URLs vary by language. Worker resolves the standard pinned default package paths. */
const im=await C.image(draft.source.data),s=im.width/1536,sy=im.height/1024;const crops=[[793,0,743,90],...Array.from({length:5},(_,i)=>[8+i*307,96,298,779]),[8,883,255,132],[270,883,655,132],[932,883,597,132]];
for(let i=0;i<crops.length;i++){if(ocrStopped)break;const [x,y,w,h]=crops[i];const can=await C.crop(draft.source.data,x*s,y*sy,w*s,h*sy,1.5);if(i>=1&&i<=5){const cc=can.getContext('2d');cc.fillStyle='white';cc.fillRect(7*s*1.5,146*sy*1.5,284*s*1.5,(i===5?133:348)*sy*1.5)}const res=await worker.recognize(can,{rotateAuto:false},{text:true});chunks.push(res.data.text||'');progress(`${i+1} / ${crops.length} · ${t('dailyWorking')}`)}
if(!ocrStopped){sync();const date=R.parseDate(chunks[0]);if(date)draft.date=date;const pm=chunks[0]?.match(/(?:Project\s*Code|รหัสงาน|項目編號)\s*[:：]?\s*([A-Za-z0-9_-]+)/i)||chunks[0]?.match(/\b(M\d{3,})\b/);if(pm)draft.project=pm[1];const prep=chunks[0]?.match(/Prepared\s*by\s*[:：]?\s*([^\n]+)/i);if(prep)draft.prepared=prep[1].split(/Project\s*Code|รหัสงาน|日期/i)[0].replace(/[=|\s]+$/,'').trim();for(let i=0;i<5;i++){const lines=(chunks[i+1]||'').split('\n').map(v=>v.trim()).filter(Boolean);draft.groups[i].people=lines.shift()?.replace(/^\d+\s*[)\]}.]?\s*/, '')||'';draft.groups[i].task=R.splitText(lines.splice(0,3).join('\n'));const planAt=lines.findIndex(x=>/Next\s*Plan|下\s*一\s*步\s*计\s*划/i.test(x));if(planAt>=0)draft.groups[i].plan=R.splitText(lines.splice(planAt).join('\n'));const waiting=lines.filter(x=>/Waiting|等\s*待/i.test(x)),done=lines.filter(x=>!/Waiting|等\s*待/i.test(x));draft.groups[i].done=R.splitText(done.join('\n'));draft.groups[i].waiting=R.splitText(waiting.join('\n'))}draft.leave=(chunks[6]||'').split('\n').map(x=>x.trim()).filter(x=>x&&!/On Leave|休假|ลาหยุด/i.test(x)).join(' ');draft.summary=R.splitText(chunks[7]||'');draft.nextPlan=R.splitText(chunks[8]||'');draft.ocrText=chunks.map((v,i)=>`[${i}]\n${v}`).join('\n\n');draft.confirmed=false;editor();progress(t('dailyDraft'))}
}catch(err){if(!ocrStopped)showError(Error('dailyOcr'))}finally{clearTimeout(timer);if(worker){await worker.terminate();worker=null}ocrBusy=false;const b=$('#dialog [data-act="daily-ocr"]');if(b)b.disabled=false}}
function previewControls(r){return `<div class="doc-controls"><label>${t('dailyPreview')}<select id="daily-output-mode"><option value="layout">${t('dailyLayout')}</option>${r.source?`<option value="source">${t('dailyOriginal')}</option>`:''}</select></label><select id="daily-output-language"><option value="both">ไทย / English / 中文</option><option value="zh">中文</option><option value="th">ภาษาไทย</option><option value="en">English</option></select>${btn('daily-png','dailyPng')}${btn('daily-jpeg','dailyJpeg')}${r.source?btn('daily-source','dailySource'):''}${btn('daily-print','print')}${btn('daily-preview-close','cancel')}</div><p class="notice">${t('dailyFormat')}</p><div id="paper" class="daily-paper"></div>`}
let reportPreview=null;
async function paint(){previewCanvas=null;const paper=$('#paper');paper.replaceChildren();try{const c=await C.render(reportPreview,outLanguage,viewMode==='source');previewCanvas=c;const im=new Image;im.alt=t('daily');im.src=c.toDataURL('image/png');paper.append(im)}catch(e){paper.textContent=(errors[e.message]||errors.dailyImage)[lang==='th'?1:0]}}
async function preview(r){reportPreview=structuredClone(r);viewMode='layout';outLanguage='both';const d=$('#document-dialog');d.classList.add('daily-output');d.innerHTML=previewControls(reportPreview);if(!d.open)d.showModal();$('#daily-output-mode').onchange=async e=>{viewMode=e.target.value;await paint()};$('#daily-output-language').onchange=async e=>{outLanguage=e.target.value;await paint()};await paint()}
function saveImage(type){if(!previewCanvas)throw Error('dailyOverflow');previewCanvas.toBlob(b=>{if(!b)return error(Error('dailyImage'));const a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download=`Daily-Service-${reportPreview.date}.${type==='image/png'?'png':'jpg'}`;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)},type,0.98)}
async function action(a,id){try{if(a==='daily-new'){draft=R.blank();editor()}else if(a==='daily-open'){draft=structuredClone(D.find(state,'daily',id));editor()}else if(a==='daily-photo')$('#daily-source-input').click();else if(a==='daily-select-source')$('#daily-editor-source').click();else if(a==='daily-cancel'){await stop();$('#dialog').close();$('#dialog').classList.remove('daily-editor');draft=null}else if(a==='daily-crop')await cropPhotos();else if(a==='daily-ocr')await ocr();else if(a==='daily-stop')await stop();else if(a==='daily-preview')await preview(D.find(state,'daily',id));else if(a==='daily-preview-draft'){sync();R.validateReport(draft,state);await preview(draft)}else if(a==='daily-preview-close'){$('#document-dialog').close();$('#document-dialog').classList.remove('daily-output')}else if(a==='daily-print'){if(!previewCanvas)throw Error('dailyOverflow');window.print()}else if(a==='daily-png')saveImage('image/png');else if(a==='daily-jpeg')saveImage('image/jpeg');else if(a==='daily-source'){const src=reportPreview.source;if(!src)throw Error('dailyImage');const link=document.createElement('a');link.href=src.data;link.download=src.name;link.click()}else if(a==='daily-link'){sync();const i=Number(id);if(!draft.groups[i].orderId)throw Error('reference');R.linkOrder(draft,i,draft.groups[i].orderId,state);draft.confirmed=false;editor()}else if(a==='daily-remove'){sync();const[i,j]=id.split(':').map(Number);draft.groups[i].photos.splice(j,1);draft.confirmed=false;editor()}}catch(e){showError(e)}}
document.addEventListener('change',async e=>{try{if(['daily-from','daily-to'].includes(e.target.id)){from=$('#daily-from').value;to=$('#daily-to').value;$('#content').innerHTML=view()}else if(e.target.id==='daily-source-input'||e.target.id==='daily-editor-source'){const file=e.target.files[0];e.target.value='';await source(file,e.target.id==='daily-editor-source')}else if(e.target.dataset.groupPhotos!==undefined){sync();const i=Number(e.target.dataset.groupPhotos);draft.groups[i].photos=await readPhotos([...e.target.files]);draft.confirmed=false;editor()}}catch(err){showError(err)}});
$('#dialog').addEventListener('cancel',()=>{if(draft){stop();draft=null;$('#dialog').classList.remove('daily-editor')}});
return {view,action};
})();
</script></body></html>
