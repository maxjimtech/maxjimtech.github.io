for(const e of s.entries){find(s,'orders',e.orderId);str(e,'symptom');if(!Number.isFinite(e.hours)||e.hours<0||e.hours>10000)fail('schema');if(e.attachments){if(!Array.isArray(e.attachments)||e.attachments.length>3)fail('attachment');for(const a of e.attachments){str(a,'name',250);if(typeof a.data!=='string'||a.data.length>2800000||!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(a.data))fail('attachment')}}}
for(const p of s.parts){str(p,'name',200);if(!Number.isInteger(p.stock)||p.stock<0||!Number.isInteger(p.minimum)||p.minimum<0)fail('stock')}
for(const m of s.moves){find(s,'parts',m.partId);if(m.orderId)find(s,'orders',m.orderId);if(!Number.isInteger(m.qty)||!m.qty)fail('stock')}
for(const t of s.techs){str(t,'name',200);if(!Array.isArray(t.skills)||!t.skills.length||!t.skills.every(x=>['general','hydraulic','electrical','mechanical','injection'].includes(x))||!Number.isInteger(t.slots)||t.slots<0||t.slots>20)fail('schema')}
for(const t of s.techs)if(s.orders.filter(o=>o.assignee===t.id&&o.status!=='closed').length>t.slots)fail('assignment');
for(const p of s.plans){find(s,'machines',p.machineId);if(p.orderId)find(s,'orders',p.orderId);if(!Number.isInteger(p.interval)||p.interval<1||p.interval>3650||!/^\d{4}-\d{2}-\d{2}$/.test(p.next))fail('schema')}
for(const q of s.quotes){find(s,'orders',q.orderId);if(!['TWD','THB','USD'].includes(q.currency)||!['draft','approved','accepted','invoiced'].includes(q.status))fail('schema');if(!q.publicCustomer||!q.publicMachine||!q.company)fail('schema');const t=totals(q.lines,q.discount/100,q.taxRate);if(t.total!==q.total||t.subtotal!==q.subtotal||t.tax!==q.tax)fail('money');if(q.status!=='draft'&&!q.approver)fail('approval');if(['accepted','invoiced'].includes(q.status)&&!q.acceptance)fail('approval');if(q.status==='invoiced'&&(find(s,'orders',q.orderId).status!=='closed'||!q.invoiceNumber))fail('safety')}
const refs=new Set;for(const p of s.payments){const q=find(s,'quotes',p.quoteId);if(q.status!=='invoiced'||p.currency!==q.currency||!Number.isSafeInteger(p.amount)||p.amount<=0)fail('money');str(p,'reference');let r=p.quoteId+'|'+p.reference;if(refs.has(r))fail('duplicate');refs.add(r)}for(const q of s.quotes){if(paid(s,q.id)>q.total)fail('overpay');if(q.status==='invoiced'&&s.quotes.filter(x=>x.status==='invoiced'&&x.orderId===q.orderId).length>1)fail('duplicate')}return s}

function optimize(jobs,techs){if(jobs.length>100||techs.length>30)throw Error('optimizerLimit');const n=2+jobs.length+techs.length,S=n-2,T=n-1,G=Array.from({length:n},()=>[]),edges=[];function edge(a,b,cap,cost){const e={to:b,cap,cost,rev:G[b].length};G[a].push(e);G[b].push({to:a,cap:0,cost:-cost,rev:G[a].length-1});return e}

const $=s=>document.querySelector(s),h=(tag,text)=>{let e=document.createElement(tag);e.textContent=text;return e},money=(n,c)=>new Intl.NumberFormat(lang==='th'?'th-TH':'zh-TW',{style:'currency',currency:c}).format(n/100),dt=v=>v?new Date(v).toLocaleString(lang==='th'?'th-TH':'zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—',btn=(act,label,data='',cls='')=>`<button type="button" class="${cls}" data-act="${act}" data-id="${esc(data)}">${esc(t(label))}</button>`;

const dbName=()=>demo?'maxjim-online-demo-v1':'maxjim-online-workspace-v1';
async function openDB(){if(db)db.close();db=await new Promise((ok,no)=>{let r=indexedDB.open(dbName(),1);r.onupgradeneeded=()=>r.result.createObjectStore('workspace');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(Error('storage'))});state=await readDB()||D.blank();ready=true;render()}
async function readDB(){return new Promise((ok,no)=>{let tx=db.transaction('workspace','readonly'),r=tx.objectStore('workspace').get('state');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(Error('storage'))})}
async function commit(action,fn){if(dirty||!ready)return;dirty=true;try{const expected=state.revision,next=structuredClone(state);fn(next);D.validate(next);if(new TextEncoder().encode(JSON.stringify(next)).length>70*1024*1024)throw Error('limit');next.revision=expected+1;await new Promise((ok,no)=>{let tx=db.transaction('workspace','readwrite'),store=tx.objectStore('workspace'),r=store.get('state'),conflict=false;r.onsuccess=()=>{if((r.result?.revision||0)!==expected){conflict=true;tx.abort();return}store.put(next,'state')};tx.oncomplete=ok;tx.onabort=()=>no(Error(conflict?'conflict':'storage'));tx.onerror=()=>no(Error('storage'))});state=next;proposal=null;render();message(t('saved'));return true}catch(e){if(e.message==='conflict'){state=await readDB()||D.blank();render()}error(e);return false}finally{dirty=false}}

const specs={customers:[['name','text',true],['thai','text'],['contact','text'],['address','textarea'],['note','textarea']],machines:[['customerId','select',true,'customers'],['name','text',true],['serial','text',true],['type','select',true,[['press','press'],['rubber','rubber'],['lsr','lsr']]],['note','textarea']],orders:[['machineId','select',true,'machines'],['title','text',true],['priority','select',true,[['1','1'],['2','2'],['3','3'],['4','4']]],['skill','select',true,[['general','general'],['hydraulic','hydraulic'],['electrical','electrical'],['mechanical','mechanical'],['injection','injection']]],['assignee','select',false,'techs'],['status','select',true,[['open','open'],['working','working'],['waiting','waiting']]],['symptom','textarea',true],['note','textarea']],parts:[['name','text',true],['sku','text',true],['minimum','number',true],['note','textarea']],plans:[['machineId','select',true,'machines'],['title','text',true],['next','date',true],['interval','number',true],['note','textarea']],techs:[['name','text',true],['slots','number',true],['skills','checks',true,['general','hydraulic','electrical','mechanical','injection']],['contact','text'],['note','textarea']]};
Object.assign(pairs,{brand:['品牌／型號','ยี่ห้อ / รุ่น'],year:['出廠年份','ปีผลิต'],tonnage:['合模噸數／額定規格','แรงปิด / สเปกพิกัด'],manual:['原廠手冊版本／公司檔案位置','รุ่นคู่มือ / ตำแหน่งไฟล์บริษัท'],oil:['油位／油溫／污染與洩漏','ระดับ อุณหภูมิ ปนเปื้อนและรั่วน้ำมัน'],pressure:['壓力設定／實測／單位','แรงดันตั้ง / วัด / หน่วย'],heat:['各區溫度設定／實測／硫化時間','อุณหภูมิตั้ง/วัดแต่ละโซน และเวลาวัลคาไนซ์'],plc:['警報／I/O／程式備份版本','สัญญาณเตือน / I/O / รุ่นสำรองโปรแกรม'],clamp:['導柱／合模平行度／頂出／潤滑','เสานำ / ความขนาน / กระทุ้ง / หล่อลื่น'],feed:['塑化／螺桿／噴嘴／冷流道','พลาสติไซซ์ / สกรู / หัวฉีด / ทางวิ่งเย็น'],ratio:['LSR A/B 批號／計量比設定與實測／混合器','LSR ล็อต A/B / อัตราจ่ายตั้งและวัด / เครื่องผสม'],water:['氣源／冷卻進出溫／流量／真空','ลม / อุณหภูมิน้ำเข้าออก / อัตราไหล / สุญญากาศ']});

const label=k=>t(({customerId:'customer',machineId:'machine',tax:'taxRate',orderId:'orders'})[k]||k);
function field(f,value){const [key,type,required,opts]=f,id='f-'+key;value=value??(key==='priority'?'2':key==='interval'?'30':key==='slots'?'1':key==='minimum'?'0':'');let body='';if(type==='select'){let list=typeof opts==='string'?options(opts):opts.map(([v,l])=>[v,t(l)]);body=`<select id="${id}" name="${key}" ${required?'required':''}>${required?'':opt('',t('none'))}${list.map(([v,l])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`}else if(type==='checks'){body=`<fieldset><legend>${label(key)}</legend>${opts.map(k=>`<label class="check"><input type="checkbox" name="${key}" value="${k}" ${(value||[]).includes(k)?'checked':''}>${t(k)}</label>`).join('')}</fieldset>`}else if(type==='textarea')body=`<textarea id="${id}" name="${key}" ${required?'required':''} maxlength="20000">${esc(value)}</textarea>`;else if(type==='checkbox')body=`<input id="${id}" name="${key}" type="checkbox" required>`;else body=`<input id="${id}" name="${key}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="1"':''} maxlength="500">`;return type==='checks'?body:`<label class="field" for="${id}"><span>${esc(label(key))}${required?' *':''}</span>${body}</label>`}
function form(title,fields,values,handler,extra=''){const d=$('#dialog');d.innerHTML=`<form id="form"><header><h2>${esc(title)}</h2></header><div class="formbody">${extra}${fields.map(f=>field(f,values?.[f[0]])).join('')}<p id="form-error" class="error" role="alert"></p></div><footer>${btn('cancel','cancel')}<button type="submit" class="primary">${t('save')}</button></footer></form>`;d.showModal();$('#form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const data=new FormData(e.target),v=Object.fromEntries(data);for(const f of fields)if(f[1]==='checks')v[f[0]]=data.getAll(f[0]);try{const result=await handler(v,data);if(result!==false)d.close();else $('#form-error').textContent=$('#message').textContent}catch(err){$('#form-error').textContent=(errors[err.message]||[err.message,err.message])[lang==='th'?1:0]}finally{b.disabled=false}}}
function editEntity(k,rid=''){const old=rid?D.find(state,k,rid):null;if(k==='orders'&&old?.status==='closed')return error(Error('closed'));if(k==='customers'&&!rid&&state.customers.length>=200)return error(Error('customers200'));let fields=specs[k];if(k==='orders'&&old)fields=fields.filter(f=>f[0]!=='machineId');if(k==='machines'&&old)fields=fields.filter(f=>f[0]!=='customerId');form(t(rid?'edit':'add')+' · '+t(k),fields,old,async v=>{for(const f of fields)if(f[1]==='number')v[f[0]]=Number(v[f[0]]);if(k==='orders')v.priority=Number(v.priority);if(k==='techs'&&!v.skills.length)throw Error('schema');if(k==='plans'&&(!Number.isInteger(v.interval)||v.interval<1||v.interval>3650))throw Error('schema');return commit('edit',s=>{if(old){Object.assign(D.find(s,k,rid),v);D.audit(s,'edit:'+k,rid)}else{if(k==='parts')v.stock=0;if(k==='orders')v.number='WO-'+String(s.orders.length+1).padStart(5,'0');D.add(s,k,v)}})})}
function list(headers,rows){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${esc(t(x))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">${t('empty')}</div>`}
const customerName=m=>{const c=state.customers.find(c=>c.id===m?.customerId);return c?(lang==='th'&&c.thai?c.thai:c.name):'—'},machineName=id=>state.machines.find(m=>m.id===id)?.name||'—',orderName=id=>state.orders.find(o=>o.id===id)?.number||'—';
let query='';const match=r=>!query||JSON.stringify(r).toLowerCase().includes(query.toLowerCase());
function render(){if(!ready)return;document.documentElement.lang=lang==='th'?'th':'zh-Hant';document.title='MAXJIM · '+t(page)+' · '+VERSION;$('#mode').textContent=t(demo?'demoMode':'local');$('#language').textContent=lang==='zh'?'ภาษาไทย':'繁體中文';$('#storage').textContent=t('storage');$('#nav').innerHTML=['dashboard','customers','machines','orders','parts','plans','techs','quotes','reports','backup','audit'].map(k=>`<button data-act="nav" data-id="${k}" ${page===k?'aria-current="page"':''}>${t(k)}</button>`).join('');$('#title').textContent=t(page);$('#tools').innerHTML=(specs[page]&&!selected?btn('add','add',page,'primary'):'')+(page==='orders'&&!selected?'':page==='customers'?`<span>${state.customers.length} / 200</span>`:'');$('#searchlabel').textContent=t('search');$('#search').hidden=!['customers','machines','orders','parts','plans','quotes','techs'].includes(page)||!!selected;$('#searchlabel').hidden=$('#search').hidden;$('#content').innerHTML=view();}
function view(){if(page==='dashboard'){const active=state.orders.filter(x=>x.status!=='closed').length,due=state.plans.filter(p=>p.next<=new Date().toISOString().slice(0,10)).length;return `<div class="stats">${[['customers',state.customers.length+' / 200'],['machines',state.machines.length],['orders',active],['due',due]].map(([k,v])=>`<article><span>${t(k)}</span><strong>${v}</strong></article>`).join('')}</div><section class="panel"><h2>${t('instructions')}</h2><p>${t('help')}</p><p>${t('safetyNote')}</p>${btn('demo',demo?'real':'demo')} ${btn('nav','backup','backup')}</section><section class="panel"><h2>${t('orders')}</h2>${list(['title','machine','status','detail'],state.orders.filter(o=>o.status!=='closed').sort((a,b)=>a.priority-b.priority||a.createdAt.localeCompare(b.createdAt)).slice(0,10).map(o=>[esc(o.number+' '+o.title),esc(machineName(o.machineId)),t(o.status),btn('order','detail',o.id)]))}</section>`}
if(page==='customers')return list(['name','thai','contact','address','detail'],state.customers.filter(match).map(c=>[esc(c.name),esc(c.thai),esc(c.contact),esc(c.address),btn('edit','edit','customers:'+c.id)]));
if(page==='machines')return list(['name','serial','type','customer','detail'],state.machines.filter(match).map(m=>[esc(m.name),esc(m.serial),t(m.type),esc(customerName(m)),btn('edit','edit','machines:'+m.id)]));
if(page==='orders'){if(selected)return orderView(D.find(state,'orders',selected));return list(['title','machine','priority','assignee','status','detail'],state.orders.filter(match).sort((a,b)=>a.priority-b.priority||a.createdAt.localeCompare(b.createdAt)).map(o=>[esc(o.number+' '+o.title),esc(machineName(o.machineId)),o.priority,esc(state.techs.find(t=>t.id===o.assignee)?.name||t('none')),t(o.status),btn('order','detail',o.id)+(o.status!=='closed'?btn('edit','edit','orders:'+o.id):'')]))}
if(page==='parts')return list(['name','sku','stock','minimum','detail'],state.parts.filter(match).map(p=>[esc(p.name),esc(p.sku),`<span class="${p.stock<=p.minimum?'warn':''}">${p.stock}</span>`,p.minimum,btn('move','movement',p.id)+btn('edit','edit','parts:'+p.id)]))+`<h2>${t('movements')}</h2>`+list(['name','qty','reason','orders'],state.moves.slice(-50).reverse().map(m=>[esc(state.parts.find(p=>p.id===m.partId)?.name),m.qty,esc(m.reason),esc(orderName(m.orderId))]));
if(page==='plans')return `<p>${t('safetyNote')}</p>`+list(['title','machine','next','interval','detail'],state.plans.filter(match).map(p=>[esc(p.title),esc(machineName(p.machineId)),`<span class="${p.next<=new Date().toISOString().slice(0,10)?'warn':''}">${esc(p.next)}</span>`,p.interval,btn('edit','edit','plans:'+p.id)+(p.orderId?btn('order','detail',p.orderId):btn('generate','generate',p.id))]));
if(page==='techs')return `<p class="notice">${t('optimizerNote')}</p>`+list(['name','skills','slots','detail'],state.techs.filter(match).map(p=>[esc(p.name),p.skills.map(t).join(' / '),p.slots,btn('edit','edit','techs:'+p.id)]))+btn('optimize','optimize','','primary')+(proposal?`<section class="panel"><h2>${t('optimize')}</h2>${list(['orders','assignee'],proposal.assigned.map(a=>[esc(orderName(a.orderId)),esc(state.techs.find(t=>t.id===a.techId)?.name)]))}${proposal.unassigned.map(u=>`<p>${esc(orderName(u.orderId))}: ${t(u.reason==='capacity'?'capacity':'skillMissing')}</p>`).join('')}${proposal.assigned.length?btn('apply','apply','','primary'):''}</section>`:'');
if(page==='quotes')return list(['name','orders','status','total','balance','detail'],state.quotes.filter(match).slice().reverse().map(q=>[esc(q.invoiceNumber||q.number),esc(orderName(q.orderId)),t(q.status),money(q.total,q.currency),q.status==='invoiced'?money(q.total-D.paid(state,q.id),q.currency):'—',btn('preview','preview',q.id)+(q.status==='draft'?btn('approve','approve',q.id):q.status==='approved'?btn('accept','accept',q.id):q.status==='accepted'?btn('invoice','invoice',q.id):btn('payment','payment',q.id))]));
if(page==='reports'){const closed=state.orders.filter(o=>o.status==='closed').length,hours=state.entries.reduce((a,e)=>a+e.hours,0);return `<p>${t('reportNote')}</p><div class="stats"><article>${t('closed')}<strong>${closed}</strong></article><article>${t('hours')}<strong>${hours.toFixed(2)}</strong></article></div>`+list(['currency','total','paid','balance'],['TWD','THB','USD'].map(c=>{const qs=state.quotes.filter(q=>q.currency===c&&q.status==='invoiced'),sum=qs.reduce((a,q)=>a+q.total,0),p=qs.reduce((a,q)=>a+D.paid(state,q.id),0);return [c,money(sum,c),money(p,c),money(sum-p,c)]}))+`<h2>${t('machine')}</h2>`+list(['machine','orders','hours'],state.machines.map(m=>{const ids=state.orders.filter(o=>o.machineId===m.id).map(o=>o.id);return [esc(m.name),ids.length,state.entries.filter(e=>ids.includes(e.orderId)).reduce((a,e)=>a+e.hours,0).toFixed(2)]}))+btn('csv','exportCsv')}

if(page==='backup')return `<section class="panel"><h2>${t('backup')}</h2><p>${t('backupNote')}</p><div class="actions">${btn('backup','backupDisk','','primary')}${btn('import','restore')}${btn('download','download')}</div><p>${t('updated')}: ${esc(getPref('backup-'+dbName())||'—')}</p><p>${t('restoreNote')}</p><input type="file" id="import-file" accept=".json,application/json" hidden></section><section class="panel"><h2>${t('company')}</h2><p>${esc(state.settings.company)}<br>${esc(state.settings.address)}<br>${esc(state.settings.contact)}</p>${btn('settings','edit')}<p>${t('noLogin')}</p><p>${t('safetyNote')}</p><p>MAXJIM ${VERSION} · IndexedDB · 200 ${t('customers')} · TWD / THB / USD</p></section>`;
return ''}
function orderView(o){const m=state.machines.find(m=>m.id===o.machineId);return `${btn('back','back')}<section class="panel"><div class="eyebrow">${esc(o.number)} · ${t(o.status)}</div><h2>${esc(o.title)}</h2><p>${esc(customerName(m))} / ${esc(m?.name)} / ${esc(m?.serial)}</p><h3>${t('symptom')}</h3><p class="pre">${esc(o.symptom)}</p><p class="notice">${t('rule')}: ${t(OPT.classify(o.symptom))}</p><div class="actions">${o.status!=='closed'?btn('entry','entry',o.id,'primary')+btn('close','acceptance',o.id):''}${btn('quote','quote',o.id)}</div>${o.acceptance?`<h3>${t('acceptance')}</h3><p>${esc(o.acceptance.reviewer)} · ${dt(o.closedAt)}</p><p class="pre">${esc(o.acceptance.result)}</p>`:''}</section><h2>${t('records')}</h2>${state.entries.filter(e=>e.orderId===o.id).map(e=>`<article class="panel"><h3>${esc(e.technician)} · ${e.hours} ${t('hours')}</h3><p>${dt(e.arrival)} → ${dt(e.departure)}</p>${['symptom','diagnosis','action','oil','pressure','heat','plc','clamp','water','feed','ratio','result','measure','partsText','note'].filter(k=>e[k]).map(k=>`<h4>${t(k)}</h4><p class="pre">${esc(e[k])}</p>`).join('')}<div class="photos">${(e.attachments||[]).map(a=>`<a href="${esc(a.data)}" download="${esc(a.name)}"><img src="${esc(a.data)}" alt="${esc(a.name)}" loading="lazy"><span>${esc(a.name)}</span></a>`).join('')}</div></article>`).join('')||`<p>${t('empty')}</p>`}`}
async function readPhotos(files){if(files.length>3)throw Error('attachment');const out=[];for(const f of files){if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>2*1024*1024)throw Error('attachment');const data=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=()=>no(Error('attachment'));r.readAsDataURL(f)});out.push({name:f.name,data})}return out}
function entry(oid){const machine=state.machines.find(m=>m.id===D.find(state,'orders',oid).machineId);const technical=['oil','pressure','heat','plc','clamp','water',...(machine?.type==='press'?[]:['feed']),...(machine?.type==='lsr'?['ratio']:[])];const fields=[['technician','text',true],['arrival','datetime-local',true],['departure','datetime-local',true],['hours','text',true],...['symptom','diagnosis','action',...technical,'result','measure','partsText','note'].map(k=>[k,'textarea',k==='symptom'||k==='action'])];const current=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);form(t('entry'),fields,{arrival:current,departure:current,hours:'0',symptom:D.find(state,'orders',oid).symptom},async v=>{const hours=Number(v.hours);if(!isFinite(hours)||hours<0||hours>10000||new Date(v.departure)<new Date(v.arrival))throw Error('time');const attachments=await readPhotos([...$('#photos').files]);return commit('entry',s=>{if(D.find(s,'orders',oid).status==='closed')throw Error('closed');D.add(s,'entries',{...v,hours,arrival:new Date(v.arrival).toISOString(),departure:new Date(v.departure).toISOString(),attachments,orderId:oid})})},`<label for="photos">${t('attachment')}</label><input id="photos" type="file" accept="image/png,image/jpeg,image/webp" multiple>`)}
function quoteForm(oid){form(t('quote'),[['currency','select',true,['TWD','THB','USD'].map(x=>[x,x])],['lines','textarea',true],['discount','text',true],['taxRate','text',true],['terms','textarea']],{currency:'THB',discount:'0',taxRate:'0'},async v=>{const lines=v.lines.split('\n').filter(l=>l.trim()).map(l=>{let [description,qty,price,...rest]=l.split('|').map(x=>x.trim());if(rest.length||!/^\d+$/.test(qty))throw Error('lines');return {description,qty:Number(qty),price}});return commit('quote',s=>D.quote(s,oid,v.currency,lines,v.discount,v.taxRate,v.terms))})}
function documentView(q){docQuote=q;docLang='both';const dialog=$('#document-dialog');dialog.innerHTML=`<div class="doc-controls"><label for="doc-language">${t('preview')}</label><select id="doc-language"><option value="both">中文 / ไทย</option><option value="zh">繁體中文</option><option value="th">ภาษาไทย</option></select>${btn('print','print')}${btn('doc-close','cancel')}</div><div id="paper"></div>`;paintDocument();dialog.showModal();$('#doc-language').onchange=e=>{docLang=e.target.value;paintDocument()}}
function paintDocument(){const d=D.publicDocument(docQuote,docLang),tr=k=>docLang==='both'?pairs[k].join(' / '):pairs[k][docLang==='th'?1:0],m=n=>money(n,d.currency);$('#paper').innerHTML=`<div class="paper"><h1>${esc(d.company.company)}</h1><p class="pre">${esc(d.company.address)}<br>${esc(d.company.contact)}</p><h2>${d.status==='invoiced'?tr('invoice'):tr('quote')}</h2><p>${esc(d.number)} · ${dt(d.date)} · ${tr('status')}: ${tr(d.status)}</p><p>${esc(docLang==='th'?(d.customer.thai||d.customer.name):docLang==='both'?[d.customer.name,d.customer.thai].filter(Boolean).join(' / '):d.customer.name)}<br>${esc(d.customer.address)}<br>${esc(d.customer.contact)}</p><p>${esc(d.machine.name)} / ${esc(d.machine.serial)}</p><table><thead><tr><th>${tr('title')}</th><th>${docLang==='zh'?'數量':docLang==='th'?'จำนวน':'數量 / จำนวน'}</th><th>${docLang==='zh'?'單價':docLang==='th'?'ราคาต่อหน่วย':'單價 / ราคาต่อหน่วย'}</th><th>${tr('total')}</th></tr></thead><tbody>${d.lines.map(l=>`<tr><td class="pre">${esc(l.description)}</td><td>${l.qty}</td><td>${m(D.cents(l.price))}</td><td>${m(D.cents(l.price)*l.qty)}</td></tr>`).join('')}</tbody></table>${['subtotal','discount','tax','total'].map(k=>`<p class="sum"><strong>${tr(k)}: ${m(d[k])}</strong></p>`).join('')}<p class="pre">${esc(d.terms)}</p><p>${docLang==='zh'?'維修報價／請款文件；非稅務發票。':docLang==='th'?'เอกสารเสนอราคา/เรียกเก็บงานซ่อม ไม่ใช่ใบกำกับภาษี':'維修報價／請款文件；非稅務發票。 / ไม่ใช่ใบกำกับภาษี'}</p></div>`}
function getPref(k){try{return localStorage.getItem(k)}catch{return null}}function pref(k,v){try{localStorage.setItem(k,v)}catch{}}
function downloadText(text,name,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
async function hash(text){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function backup(){const payload=JSON.stringify(state),bundle=JSON.stringify({format:'maxjim-browser-backup',version:1,exportedAt:D.now(),sha256:await hash(payload),payload},null,2),name='MAXJIM-'+(demo?'DEMO-':'')+new Date().toISOString().replace(/[:.]/g,'-')+'.json';try{if(window.showSaveFilePicker){const handle=await window.showSaveFilePicker({suggestedName:name,types:[{description:'MAXJIM JSON',accept:{'application/json':['.json']}}]});const w=await handle.createWritable();await w.write(bundle);await w.close()}else downloadText(bundle,name,'application/json');pref('backup-'+dbName(),dt(D.now()));message(t('backupDisk')+' ✓');if(page==='backup')render()}catch(e){if(e.name!=='AbortError')error(Error('file'))}}
async function importBackup(file){if(!file)return;if(file.size>80*1024*1024)throw Error('file');const bundle=JSON.parse(await file.text());if(bundle.format!=='maxjim-browser-backup'||bundle.version!==1||typeof bundle.payload!=='string')throw Error('schema');if(await hash(bundle.payload)!==bundle.sha256)throw Error('hash');if(new TextEncoder().encode(bundle.payload).length>70*1024*1024)throw Error('limit');const incoming=D.validate(JSON.parse(bundle.payload,(k,v)=>{if(['__proto__','constructor','prototype'].includes(k))throw Error('schema');return v}));form(t('restore'),[],{},async()=>commit('restore',s=>{const rev=s.revision;for(const k of Object.keys(s))delete s[k];Object.assign(s,structuredClone(incoming),{revision:rev});D.audit(s,'restore',bundle.exportedAt)}),`<p>${t('restoreNote')}</p><p>${t('customers')}: ${incoming.customers.length} / ${t('orders')}: ${incoming.orders.length} / ${t('quotes')}: ${incoming.quotes.length}</p><label class="check"><input type="checkbox" required> ${t('confirmRestore')}</label>`)}
function csv(){const rows=[['machine','serial','customer','order','status','hours'],...state.orders.map(o=>{const m=state.machines.find(m=>m.id===o.machineId);return [m?.name,m?.serial,customerName(m),o.number,o.status,state.entries.filter(e=>e.orderId===o.id).reduce((a,e)=>a+e.hours,0)]})];const safe=v=>{let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};downloadText('\ufeff'+rows.map(r=>r.map(safe).join(',')).join('\r\n'),'MAXJIM-report.csv','text/csv;charset=utf-8')}
async function switchDemo(){demo=!demo;query='';selected='';page='dashboard';await openDB();if(demo&&!state.customers.length)await commit('demo',s=>{const c=D.add(s,'customers',{name:'示範橡膠工廠',thai:'โรงงานยางสาธิต',contact:'虛構資料 / ข้อมูลสมมติ',address:'',note:'DEMO ONLY'}),m=D.add(s,'machines',{customerId:c.id,name:'DEMO PRESS',serial:'DEMO-001',type:'press',note:''});D.add(s,'orders',{machineId:m.id,number:'WO-00001',title:'油缸漏油 / น้ำมันรั่ว',symptom:'油缸漏油',priority:1,skill:'hydraulic',assignee:'',status:'open',note:'示範內部成本機密 DEMO-SECRET'});D.add(s,'parts',{name:'油封 / ซีล',sku:'DEMO-SEAL',stock:5,minimum:2,note:''});D.add(s,'techs',{name:'示範師傅 / ช่างสาธิต',skills:['general','hydraulic'],slots:2,contact:'',note:''})})}
async function action(act,id){if(act==='nav'){page=id;selected='';query='';$('#search').value='';render()}else if(act==='cancel')$('#dialog').close();else if(act==='add')editEntity(id);else if(act==='edit'){const [k,r]=id.split(':');editEntity(k,r)}else if(act==='order'){page='orders';selected=id;render()}else if(act==='back'){selected='';render()}else if(act==='entry')entry(id);else if(act==='quote')quoteForm(id);else if(act==='close')form(t('acceptance'),[['isolation','checkbox',true],['interlock','checkbox',true],['test','checkbox',true],['reviewer','text',true],['result','textarea',true]],{},v=>commit('close',s=>D.closeOrder(s,id,{...v,isolation:!!v.isolation,interlock:!!v.interlock,test:!!v.test})),`<p>${t('safetyNote')}</p>`);else if(act==='move')form(t('movement'),[['qty','text',true],['reason','textarea',true],['orderId','select',false,'orders']],{},v=>{if(!/^-?\d+$/.test(v.qty))throw Error('stock');return commit('stock',s=>D.stock(s,id,Number(v.qty),v.reason,v.orderId))});else if(act==='generate')await commit('pm',s=>{const p=D.find(s,'plans',id);if(p.orderId)throw Error('duplicate');const o=D.add(s,'orders',{number:'WO-'+String(s.orders.length+1).padStart(5,'0'),machineId:p.machineId,title:p.title,symptom:p.note||p.title,priority:2,skill:'general',assignee:'',status:'open',note:'PM'});p.orderId=o.id});else if(act==='preview')documentView(D.find(state,'quotes',id));else if(act==='doc-close')$('#document-dialog').close();else if(act==='print'){paintDocument();window.print()}else if(act==='approve')form(t('approve'),[['reviewer','text',true]],{},v=>commit('approve',s=>D.approve(s,id,v.reviewer)));else if(act==='accept')form(t('accept'),[['reviewer','textarea',true]],{},v=>commit('accept',s=>D.accept(s,id,v.reviewer)));else if(act==='invoice')form(t('invoice'),[],{},()=>commit('invoice',s=>D.invoice(s,id)),`<p>${esc(D.find(state,'quotes',id).number)} · ${t('invoice')}</p><label class="check"><input type="checkbox" required> ${t('approve')}</label>`);else if(act==='payment'){const q=D.find(state,'quotes',id);form(t('payment'),[['amount','text',true],['currency','select',true,[[q.currency,q.currency]]],['reference','text',true]],{currency:q.currency},v=>commit('payment',s=>D.pay(s,id,v.amount,v.currency,v.reference)),`<p>${t('balance')}: ${money(q.total-D.paid(state,q.id),q.currency)}</p>`)}else if(act==='settings')form(t('company'),[['company','text',true],['address','textarea'],['contact','text']],state.settings,v=>commit('settings',s=>{s.settings=v;D.audit(s,'settings','company')}));else if(act==='backup')await backup();else if(act==='import')$('#import-file').click();else if(act==='download'){const clone=document.documentElement.cloneNode(true);for(const id of ['content','nav','message','title','tools','dialog','document-dialog'])clone.querySelector('#'+id).replaceChildren();clone.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));downloadText('<!doctype html>\n'+clone.outerHTML,'MAXJIM-maintenance-0.6.0.html','text/html;charset=utf-8')}else if(act==='demo')await switchDemo();else if(act==='csv')csv();else if(act==='optimize'){let jobs=state.orders.filter(o=>o.status!=='closed'&&!o.assignee).sort((a,b)=>a.priority-b.priority||a.createdAt.localeCompare(b.createdAt));const ts=state.techs.map(t=>({...t,slots:Math.max(0,t.slots-state.orders.filter(o=>o.assignee===t.id&&o.status!=='closed').length)}));proposal=OPT.optimize(jobs,ts);render()}else if(act==='apply'){const p=structuredClone(proposal);form(t('apply'),[],{},()=>commit('dispatch',s=>{for(const a of p.assigned){const o=D.find(s,'orders',a.orderId);if(o.assignee||o.status==='closed')throw Error('conflict');o.assignee=a.techId;D.audit(s,'dispatch',o.id)}}),`<p>${p.assigned.length} ${t('orders')}</p><label class="check"><input type="checkbox" required> ${t('apply')}</label>`)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)action(b.dataset.act,b.dataset.id).catch(error)});document.addEventListener('change',e=>{if(e.target.id==='import-file')importBackup(e.target.files[0]).catch(error)});$('#language').onclick=()=>{lang=lang==='zh'?'th':'zh';pref('mj-language',lang);render()};$('#search').addEventListener('input',e=>{query=e.target.value;$('#content').innerHTML=view()});$('#dialog').addEventListener('cancel',()=>{});lang=getPref('mj-language')==='th'?'th':'zh';openDB().catch(error);
</script></body></html>
