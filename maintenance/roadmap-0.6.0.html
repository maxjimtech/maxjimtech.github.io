const $=s=>document.querySelector(s);const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n};
function renderCards(){const q=$('#search').value.trim().toLocaleLowerCase();const filtered=rows.filter(r=>(priority==='all'||r[1]===priority)&&r.join(' ').toLocaleLowerCase().includes(q));$('#cards').replaceChildren(...filtered.map(r=>{const c=el('article',null,'card');c.append(el('span',r[0].toUpperCase()+' · '+r[1],'pill'),el('h3',r[language==='zh'?2:3]));const d=el('details');d.open=true;d.append(el('summary',ui[language].detail),el('p',r[language==='zh'?4:5]));c.append(d);return c}));$('#count').textContent=filtered.length+' / '+rows.length+' '+ui[language].count;$('#empty').hidden=filtered.length!==0;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===priority)))}
function render(){const t=ui[language];document.documentElement.lang=language==='zh'?'zh-Hant':'th';document.title='MAXJIM · '+t.title+' · 0.6.0';document.querySelectorAll('[data-t]').forEach(n=>n.textContent=t[n.dataset.t]);['zh','th'].forEach(l=>$('#'+l).setAttribute('aria-pressed',String(l===language)));$('#nav').replaceChildren(...['catalog','workflow','fields','gates','sources'].map(k=>{const a=el('a',t[k]);a.href='#'+k;return a}));$('#steps').replaceChildren(...t.steps.map((s,i)=>{const d=el('div',null,'step');d.append(el('b',String(i+1).padStart(2,'0')),el('span',s));return d}));$('#fieldgroups').replaceChildren(...t.fieldgroups.map(r=>{const c=el('article',null,'card');c.append(el('h3',r[0]),el('p',r[1]));return c}));$('#accept').replaceChildren(...t.accept.map(s=>el('li',s)));$('#sourceList').replaceChildren(...sources.map((url,i)=>{const li=el('li'),a=el('a',t.sourceLabels[i]);a.href=url;li.append(a);return li}));renderCards()}
['zh','th'].forEach(l=>$('#'+l).onclick=()=>{language=l;try{localStorage.setItem('maxjim-plan-language',l)}catch(e){}render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{priority=b.dataset.filter;renderCards()});$('#search').addEventListener('input',renderCards);$('#print').onclick=()=>window.print();$('#download').onclick=()=>{const b=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'}),u=URL.createObjectURL(b),a=el('a');a.href=u;a.download='maxjim-maintenance-roadmap-0.6.0.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(d=>d.open=true));render();
</script></body></html>
