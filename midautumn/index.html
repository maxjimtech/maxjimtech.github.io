<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>旌旗教會大雅分點｜中秋柚子趴</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ffe9b8;color:#6d3824;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}body{display:flex;justify-content:center}#app{width:100%;max-width:560px;height:var(--app-h,100dvh);min-height:0;padding:max(6px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;overflow:hidden}.header{flex:0 0 auto;background:#fff8e9;border:2px solid #ffd993;border-radius:18px;padding:7px 10px;text-align:center}.header small{font-size:12px;font-weight:900;color:#a96842}.header h1{margin:2px 0;font-size:clamp(20px,5.5vw,28px);line-height:1.05}.header p{margin:0;font-size:12px;font-weight:800}.hud{flex:0 0 auto;display:flex;gap:6px}.hudbox{flex:1;background:#fff8e9;border-radius:13px;padding:5px;text-align:center}.hudbox span{display:block;font-size:10px;font-weight:800;color:#9b6b4c}.hudbox b{font-size:20px}.game{position:relative;flex:1 1 auto;min-height:260px;overflow:hidden;border-radius:20px;border:3px solid #fff7e7;background:radial-gradient(circle at 75% 18%,#fff4bc 0 48px,transparent 49px),linear-gradient(#fff0ca 0 60%,#f5bf69 60% 100%);box-shadow:0 7px 18px rgba(100,55,30,.14);touch-action:none}.decor{position:absolute;font-size:38px;opacity:.75;pointer-events:none}.d1{left:4%;top:4%}.d2{right:4%;top:5%}.d3{left:12%;top:18%;font-size:32px}.player{position:absolute;width:96px;height:96px;left:50%;bottom:10px;transform:translateX(-50%);border-radius:50%;background:#9dbc52;border:5px solid #713c24;z-index:10}.face{position:absolute;width:66px;height:58px;left:50%;top:20px;transform:translateX(-50%);background:#fff0d8;border-radius:50%}.eye{position:absolute;top:19px;width:7px;height:7px;background:#66351f;border-radius:50%}.e1{left:18px}.e2{right:18px}.mouth{position:absolute;width:22px;height:12px;border-bottom:4px solid #66351f;border-radius:0 0 22px 22px;left:22px;top:30px}.leaf{position:absolute;width:40px;height:18px;background:#6fa43d;border:4px solid #713c24;border-radius:50%;left:18px;top:-14px;transform:rotate(-20deg)}.item{position:absolute;width:54px;height:54px;line-height:54px;text-align:center;font-size:46px;z-index:5;user-select:none;pointer-events:none}.pop{position:absolute;z-index:20;font-size:22px;font-weight:900;color:#dc6f2d;text-shadow:-2px -2px #fff,2px -2px #fff,-2px 2px #fff,2px 2px #fff;pointer-events:none}.overlay{position:absolute;inset:0;z-index:50;background:rgba(255,247,222,.92);display:flex;align-items:center;justify-content:center;padding:12px}.dialog{background:#fffaf0;border:3px solid #ffd58a;border-radius:22px;padding:15px 12px;text-align:center;width:92%;max-width:390px}.dialog .emoji{font-size:40px}.dialog h2{font-size:24px;margin:4px 0}.dialog p{font-size:13px;line-height:1.5;font-weight:800;margin:7px 0 10px}.start{border:0;border-radius:999px;background:#f3a137;color:#fff;font-size:18px;font-weight:900;padding:11px 26px;box-shadow:0 4px 0 #c87322}.legend{font-size:11px;font-weight:900;margin-top:8px}.controls{flex:0 0 auto;display:flex;gap:7px}.ctrl{flex:1;border:2px solid #ffdba0;border-radius:15px;background:#fff8e9;padding:9px 6px;font-size:17px;font-weight:900;color:#6d3824}@media(max-height:650px){.header p{display:none}.header{padding:5px 8px}.header h1{font-size:19px}.hudbox{padding:3px}.hudbox b{font-size:17px}.ctrl{padding:7px}.dialog .emoji{font-size:32px}.dialog h2{font-size:21px}.dialog p{font-size:12px}.legend{display:none}}
</style>
</head>
<body>
<div id="app">
 <div class="header"><small>旌旗教會｜大雅分點</small><h1>🌕 中秋柚子趴・接接樂</h1><p>左右移動柚子寶寶，60 秒挑戰最高分！</p></div>
 <div class="hud"><div class="hudbox"><span>分數</span><b id="score">0</b></div><div class="hudbox"><span>時間</span><b id="time">60</b></div><div class="hudbox"><span>最高</span><b id="best">0</b></div></div>
 <div id="game" class="game">
  <div class="decor d1">🏮</div><div class="decor d2">🏮</div><div class="decor d3">☁️</div>
  <div id="player" class="player"><div class="leaf"></div><div class="face"><div class="eye e1"></div><div class="eye e2"></div><div class="mouth"></div></div></div>
  <div id="overlay" class="overlay"><div class="dialog"><div class="emoji">🍐🥮🐰</div><h2 id="title">中秋柚子趴</h2><p id="msg">按「開始遊戲」後，左右移動柚子寶寶接住好物。<br>🥮 +10　⭐ +20　🏮 +30　☁️ -10</p><button id="startBtn" class="start" type="button">開始遊戲</button><div class="legend">連續接到 5 個好物，Combo 額外 +20 分</div></div></div>
 </div>
 <div class="controls"><button class="ctrl" id="leftBtn">⬅️ 向左</button><button class="ctrl" id="rightBtn">向右 ➡️</button></div>
</div>
<script>
(function(){
var game,player,overlay,scoreEl,timeEl,bestEl,startBtn;var score=0,remain=60,best=0,combo=0,running=false,gameTimer,secondTimer,spawnTimer,items=[],playerX=50,leftDown=false,rightDown=false,dragging=false;
function fit(){document.documentElement.style.setProperty('--app-h',(window.visualViewport?window.visualViewport.height:window.innerHeight)+'px')}
fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,150)});if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
function el(id){return document.getElementById(id)}
function init(){game=el('game');player=el('player');overlay=el('overlay');scoreEl=el('score');timeEl=el('time');bestEl=el('best');startBtn=el('startBtn');startBtn.onclick=startGame;bind()}
function stop(){clearInterval(gameTimer);clearInterval(secondTimer);clearInterval(spawnTimer)}
function clearAll(){for(var i=items.length-1;i>=0;i--){if(items[i].parentNode)items[i].parentNode.removeChild(items[i])}items=[]}
function startGame(){stop();clearAll();score=0;remain=60;combo=0;playerX=50;scoreEl.textContent='0';timeEl.textContent='60';setPlayer();overlay.style.display='none';running=true;gameTimer=setInterval(update,30);secondTimer=setInterval(tick,1000);spawnTimer=setInterval(spawn,650)}
function end(){running=false;stop();if(score>best)best=score;bestEl.textContent=best;el('title').textContent='🌕 挑戰完成';el('msg').innerHTML='本次得到 <b style="font-size:26px;color:#dc6f2d">'+score+'</b> 分！<br>最高紀錄：'+best+' 分';startBtn.textContent='再玩一次';overlay.style.display='flex'}
function tick(){if(!running)return;remain--;timeEl.textContent=remain;if(remain<=0)end()}
function spawn(){if(!running)return;var r=Math.random()*100,e,v;if(r<48){e='🥮';v=10}else if(r<76){e='⭐';v=20}else if(r<90){e='🏮';v=30}else{e='☁️';v=-10}var d=document.createElement('div');d.className='item';d.textContent=e;d.valueNum=v;d.y=-60;d.speed=3.4+Math.random()*2.8;d.style.left=(4+Math.random()*85)+'%';d.style.top='-60px';game.appendChild(d);items.push(d)}
function update(){if(!running)return;if(leftDown)playerX-=1.7;if(rightDown)playerX+=1.7;playerX=Math.max(8,Math.min(92,playerX));setPlayer();var pr=player.getBoundingClientRect();for(var i=items.length-1;i>=0;i--){var d=items[i];d.y+=d.speed;d.style.top=d.y+'px';var ir=d.getBoundingClientRect();if(!(ir.right<pr.left||ir.left>pr.right||ir.bottom<pr.top||ir.top>pr.bottom)){caught(d,i)}else if(d.y>game.clientHeight+70){if(d.valueNum>0)combo=0;remove(d,i)}}}
function caught(d,i){var v=d.valueNum,b=0;if(v<0){score=Math.max(0,score+v);combo=0;pop('-10',d.offsetLeft,d.offsetTop)}else{combo++;if(combo%5===0)b=20;score+=v+b;pop('+'+v+(b?' +20':''),d.offsetLeft,d.offsetTop)}scoreEl.textContent=score;remove(d,i)}
function remove(d,i){if(d.parentNode)d.parentNode.removeChild(d);items.splice(i,1)}
function pop(t,x,y){var p=document.createElement('div');p.className='pop';p.textContent=t;p.style.left=x+'px';p.style.top=y+'px';game.appendChild(p);setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p)},650)}
function setPlayer(){player.style.left=playerX+'%'}
function moveX(cx){var r=game.getBoundingClientRect();playerX=Math.max(8,Math.min(92,(cx-r.left)/r.width*100));setPlayer()}
function bind(){var L=el('leftBtn'),R=el('rightBtn');function ld(e){leftDown=true;if(e)e.preventDefault()}function lu(e){leftDown=false;if(e)e.preventDefault()}function rd(e){rightDown=true;if(e)e.preventDefault()}function ru(e){rightDown=false;if(e)e.preventDefault()}L.addEventListener('touchstart',ld,{passive:false});L.addEventListener('touchend',lu,{passive:false});R.addEventListener('touchstart',rd,{passive:false});R.addEventListener('touchend',ru,{passive:false});L.onmousedown=ld;L.onmouseup=lu;L.onmouseleave=lu;R.onmousedown=rd;R.onmouseup=ru;R.onmouseleave=ru;game.addEventListener('touchstart',function(e){if(!running)return;dragging=true;moveX(e.touches[0].clientX);e.preventDefault()},{passive:false});game.addEventListener('touchmove',function(e){if(!running||!dragging)return;moveX(e.touches[0].clientX);e.preventDefault()},{passive:false});game.addEventListener('touchend',function(){dragging=false});game.onmousedown=function(e){if(running){dragging=true;moveX(e.clientX)}};document.onmousemove=function(e){if(running&&dragging)moveX(e.clientX)};document.onmouseup=function(){dragging=false;leftDown=false;rightDown=false};document.onkeydown=function(e){if(e.keyCode===37)leftDown=true;if(e.keyCode===39)rightDown=true};document.onkeyup=function(e){if(e.keyCode===37)leftDown=false;if(e.keyCode===39)rightDown=false}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body></html>
