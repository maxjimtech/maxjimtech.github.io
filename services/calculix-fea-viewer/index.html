<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>共用 CalculiX 檢視器｜設計分析</title><style>body{margin:0;font:16px 'Microsoft JhengHei',sans-serif;background:#eaf0f5;color:#193a50}main{max-width:420px;margin:12vh auto;padding:34px;background:white;border:1px solid #d3e0e8;border-radius:14px;box-shadow:0 16px 60px #173e5515}h1{font-size:25px}p{line-height:1.8;color:#516b7c}label{display:block;margin-bottom:9px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:13px;border-radius:7px;border:1px solid #a9c0cd}button{background:#147d8b;color:white;border:0;margin-top:16px;cursor:pointer}button:disabled{opacity:.6}#msg{min-height:32px;font-size:14px;color:#945124}#lock{position:fixed;top:8px;right:18px;width:auto;z-index:3;font-size:12px;padding:8px 12px;margin:0}iframe{width:100%;height:100vh;border:0;background:white}.small{font-size:13px}</style><main id="gate"><p class="small">MAXJIM · 工程資料</p><h1>共用 CalculiX 檢視器</h1><p>輸入原始模型、INP 與 FRD 後開始<br>請輸入使用密碼開啟。</p><form id="login"><label for="password">使用密碼</label><input id="password" type="password" required autocomplete="off" autofocus><button id="submit">開啟分析</button></form><p id="msg" role="status" aria-live="polite"></p></main><button id="lock" hidden>鎖定頁面</button><script>
const $=id=>document.getElementById(id);let blobURL=null;
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function checkedFetch(url){let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('download');return r}
$('login').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('msg').textContent='正在驗證並載入加密資料…';let password=$('password').value;try{let manifest=await(await checkedFetch('manifest.json')).json(),base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);password='';let key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64(manifest.salt),iterations:manifest.iterations},base,{name:'AES-GCM',length:256},false,['decrypt']);let chunks=[];for(let i=0;i<manifest.chunks.length;i+=4){chunks.push(...await Promise.all(manifest.chunks.slice(i,i+4).map(async c=>new Uint8Array(await(await checkedFetch(c.name)).arrayBuffer()))))}let bytes=new Uint8Array(chunks.reduce((s,c)=>s+c.length,0)),offset=0;for(let c of chunks){bytes.set(c,offset);offset+=c.length}let clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(manifest.iv)},key,bytes);let html=await new Response(new Blob([clear]).stream().pipeThrough(new DecompressionStream('gzip'))).text();$('password').value='';blobURL=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));let frame=document.createElement('iframe');frame.id='viewer';frame.title='CalculiX 共用結果檢視器';frame.src=blobURL;document.body.append(frame);$('gate').hidden=true;$('lock').hidden=false;$('msg').textContent='';}catch(err){$('msg').textContent=err.name==='OperationError'?'密碼不正確，請重新輸入。':'無法開啟資料，請確認網路及瀏覽器後重試。';$('password').focus()}finally{$('submit').disabled=false;password=''}};
$('lock').onclick=()=>{document.getElementById('viewer')?.remove();if(blobURL)URL.revokeObjectURL(blobURL);blobURL=null;$('gate').hidden=false;$('lock').hidden=true;$('password').value='';$('password').focus()};
</script></html>
