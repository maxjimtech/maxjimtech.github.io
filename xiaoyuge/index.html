<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>小宇哥漁場｜虱目魚養成大作戰</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#bdebf3,#f5dfaf);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;color:#174b58}body{display:flex;justify-content:center}#app{width:100%;max-width:640px;height:var(--vh,100dvh);padding:max(6px,env(safe-area-inset-top)) 7px max(6px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;overflow:hidden}header{flex:0 0 auto;background:#fff8e8;border:2px solid #e8cf94;border-radius:16px;text-align:center;padding:7px 9px}header small{font-weight:900;color:#4d8993}header h1{margin:2px 0;font-size:clamp(21px,5.6vw,30px);line-height:1}header p{margin:0;font-size:11px;font-weight:800;color:#60787d}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:0 0 auto}.hud div{background:#fff8e8;border:1px solid #ecd9aa;border-radius:12px;text-align:center;padding:4px 2px}.hud span{display:block;font-size:9px;font-weight:900;color:#6a858a}.hud b{font-size:17px}.record{flex:0 0 auto;background:#fff8e8;border:1px solid #ecd9aa;border-radius:11px;padding:5px 8px;text-align:center;font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record b{color:#c57c16}.record button{border:0;background:transparent;color:#2d8fa0;font-weight:900;font-size:11px;padding:0 4px;margin-left:4px}#pond{position:relative;flex:1;min-height:260px;overflow:hidden;border-radius:18px;border:3px solid rgba(255,255,255,.85);background:linear-gradient(#c9f0f5 0 24%,#9fe5ec 24% 31%,#61c9d7 31% 100%);box-shadow:0 7px 18px rgba(20,85,96,.17)}#sun{position:absolute;right:8%;top:6%;width:50px;height:50px;border-radius:50%;background:#ffe17d;box-shadow:0 0 0 9px rgba(255,225,125,.24);z-index:1}#cloud{position:absolute;left:7%;top:8%;font-size:38px;opacity:.78;z-index:1}#surface{position:absolute;left:0;right:0;top:30%;height:14px;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.05));z-index:2}#surface:before{content:"";position:absolute;left:-10%;width:120%;height:14px;background:radial-gradient(circle at 10px 16px,rgba(255,255,255,.65) 0 9px,transparent 10px) repeat-x;background-size:34px 14px;animation:wave 3s linear infinite}@keyframes wave{to{transform:translateX(-34px)}}#mud{position:absolute;left:0;right:0;bottom:0;height:17%;background:linear-gradient(#d8c17a,#987141);z-index:1}.fish{position:absolute;z-index:4;left:4%;animation:swim var(--spd,8s) ease-in-out infinite alternate}.fish span{display:block;font-size:var(--fs,36px);filter:drop-shadow(0 2px 1px rgba(0,0,0,.14));animation:flip var(--spd,8s) steps(1,end) infinite}.fish.f1{top:39%;--spd:7.4s}.fish.f2{top:48%;--spd:9.1s;animation-delay:-2s}.fish.f3{top:57%;--spd:8.2s;animation-delay:-4s}.fish.f4{top:65%;--spd:10.2s;animation-delay:-1s}.fish.f5{top:44%;--spd:11s;animation-delay:-6s}.fish.f6{top:70%;--spd:8.8s;animation-delay:-3s}@keyframes swim{from{left:4%}to{left:84%}}@keyframes flip{0%,49%{transform:scaleX(1)}50%,100%{transform:scaleX(-1)}}.fish.eat span{animation:eat .45s ease 2}.fish.grow span{animation:grow .7s ease 1}@keyframes eat{50%{transform:translateY(-9px) scale(1.12)}}@keyframes grow{50%{transform:scale(1.22)}}#fx{position:absolute;inset:0;pointer-events:none;z-index:6}.bubble{position:absolute;border:2px solid rgba(255,255,255,.8);border-radius:50%;animation:bubble 1.8s linear forwards}@keyframes bubble{to{transform:translateY(-130px);opacity:0}}.pellet{position:absolute;top:27%;color:#84552b;font-weight:900;font-size:19px;animation:fall .95s linear forwards}@keyframes fall{to{transform:translateY(150px);opacity:0}}.wheel{position:absolute;left:14px;top:55%;font-size:48px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.flow{position:absolute;right:8px;top:33%;font-size:34px;animation:flow 1s ease forwards}@keyframes flow{from{transform:translateX(25px);opacity:0}20%{opacity:1}to{transform:translateX(-45px);opacity:0}}.flash{position:absolute;inset:0;background:rgba(255,255,255,.28);animation:flash .45s ease forwards}@keyframes flash{0%,100%{opacity:0}40%{opacity:1}}.sunrise{position:absolute;inset:0;background:radial-gradient(circle at 50% 100%,rgba(255,226,142,.75),rgba(255,226,142,0) 62%);animation:fade 1s ease forwards}@keyframes fade{from{opacity:1}to{opacity:0}}.panel{position:absolute;left:7px;right:7px;bottom:7px;background:rgba(255,250,238,.94);border-radius:14px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;z-index:8}.metric{background:#fff;border-radius:9px;padding:4px;text-align:center}.metric small{display:block;font-size:9px;font-weight:900}.metric b{font-size:14px}.bar{height:5px;border-radius:99px;background:#e8ece8;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;width:50%;background:#65a965;transition:width .25s,background .25s}.controls{flex:0 0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.btn{border:2px solid #e7d29e;border-radius:13px;background:#fff8e8;color:#174b58;padding:9px 5px;font-size:13px;font-weight:900;box-shadow:0 3px 0 #c5a76b}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c5a76b}.btn.next{grid-column:1/-1;background:#2d8fa0;color:#fff;border-color:#277c88;box-shadow:0 3px 0 #1d6873;font-size:15px}.msg{flex:0 0 auto;min-height:29px;border-radius:11px;background:#fff8e8;padding:6px 8px;text-align:center;font-size:11px;font-weight:800;line-height:1.35}.overlay{position:absolute;inset:0;background:rgba(235,249,249,.94);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.dialog{width:min(94%,420px);max-height:92%;overflow:auto;background:#fff9ea;border:3px solid #e7c982;border-radius:22px;padding:16px;text-align:center}.dialog .icon{font-size:46px}.dialog h2{margin:4px 0;font-size:25px}.dialog p{font-size:13px;line-height:1.55;font-weight:800}.start{border:0;border-radius:999px;padding:11px 26px;background:#2f95a6;color:#fff;font-size:17px;font-weight:900;box-shadow:0 4px 0 #1d6c78}.secondary{border:2px solid #d6c08b;border-radius:999px;padding:9px 18px;background:#fff8e8;color:#174b58;font-size:14px;font-weight:900;margin-top:8px}.tags{margin:7px 0}.tag{display:inline-block;margin:2px;padding:4px 6px;border-radius:99px;background:#e6f5f3;font-size:10px;font-weight:900}.rules{font-size:10px;color:#65797d;margin-top:8px}.nameInput{width:88%;max-width:280px;border:2px solid #e2c47c;border-radius:12px;background:#fff;padding:10px 12px;font-size:16px;font-weight:800;text-align:center;color:#174b58;outline:none;margin:6px 0}.saveStatus{min-height:20px;font-size:11px;font-weight:900;color:#60787d;margin-top:7px}.leaderboard{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:12px}.leaderboard th,.leaderboard td{padding:6px 4px;border-bottom:1px solid #eadcb8;text-align:center}.leaderboard th{font-size:10px;color:#698388}.leaderboard tr:first-child td{font-weight:900;color:#c57c16}@media(max-height:700px){header p{display:none}header{padding:5px 7px}header h1{font-size:20px}.hud b{font-size:15px}.record{padding:3px 6px}.btn{padding:7px 4px;font-size:12px}.msg{min-height:25px;padding:4px 6px}.dialog{padding:11px}.dialog .icon{font-size:35px}.dialog h2{font-size:21px}.rules{display:none}}
</style></head><body><div id="app"><header><small>🐟 小宇哥漁場</small><h1>虱目魚養成大作戰</h1><p>顧水質、餵對量、開水車，把魚養得又大又健康！</p></header><div class="hud"><div><span>天數</span><b id="day">1</b></div><div><span>魚群</span><b id="fishN">100</b></div><div><span>平均重量</span><b id="weight">20g</b></div><div><span>分數</span><b id="score">0</b></div></div><div class="record">🏆 最高紀錄：<b id="champName">讀取中…</b> <span id="champScore">0</span> 分 <button id="rankBtn" type="button">Top 10</button></div><div id="pond"><div id="sun"></div><div id="cloud">☁️</div><div id="surface"></div><div id="mud"></div><div class="fish f1"><span>🐟</span></div><div class="fish f2"><span>🐟</span></div><div class="fish f3"><span>🐟</span></div><div class="fish f4"><span>🐟</span></div><div class="fish f5"><span>🐟</span></div><div class="fish f6"><span>🐟</span></div><div id="fx"></div><div class="panel"><div class="metric"><small>溶氧 DO</small><b id="doT">6.0</b><div class="bar"><i id="doB"></i></div></div><div class="metric"><small>水溫 ℃</small><b id="tempT">28.0</b><div class="bar"><i id="tempB"></i></div></div><div class="metric"><small>鹽度 ppt</small><b id="salT">15</b><div class="bar"><i id="salB"></i></div></div></div><div id="overlay" class="overlay"><div class="dialog"><div class="icon">🐟🌊🚜</div><h2>小宇哥漁場</h2><p>照顧一池虱目魚 20 天。每天觀察水質，再決定餵飼料、開水車或換水。</p><div class="tags"><span class="tag">水溫 26–30℃</span><span class="tag">溶氧 ≥ 5</span><span class="tag">鹽度穩定</span></div><button id="start" class="start">開始養魚</button><div class="rules">教學遊戲為簡化模擬，不取代實際養殖場專業管理。</div></div></div></div><div class="controls"><button class="btn" id="feed">🥣 餵飼料</button><button class="btn" id="aerate">🌀 開水車</button><button class="btn" id="water">💧 換水</button><button class="btn" id="check">🧪 水質檢查</button><button class="btn next" id="next">☀️ 進入下一天</button></div><div class="msg" id="msg">先開始遊戲，魚兒正在等你！</div></div><script src="score-config.js?v=1"></script><script>
(function(){document.addEventListener('dblclick',function(e){e.preventDefault()},{passive:false});document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false});var day=1,fish=100,weight=20,score=0,oxygen=6,temp=28,sal=15,feedDone=0,waterDone=0,running=false;var board={highScore:{name:'尚未有人上榜',score:0,date:''},top10:[]};var apiUrl=(window.XIAOYUGE_SCORE_API||'').trim();function E(id){return document.getElementById(id)}function fit(){document.documentElement.style.setProperty('--vh',(window.visualViewport?window.visualViewport.height:window.innerHeight)+'px')}fit();window.addEventListener('resize',fit);if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rnd(a,b){return a+Math.random()*(b-a)}function say(t){E('msg').textContent=t}function bar(id,v,min,max,g1,g2){var p=clamp((v-min)/(max-min)*100,0,100),b=E(id);b.style.width=p+'%';b.style.background=(v>=g1&&v<=g2)?'#65a965':((v<g1*.8||v>g2*1.15)?'#d66056':'#e8aa3d')}function fishEls(){return document.querySelectorAll('.fish')}function growFish(){var size=clamp(30+weight/9,32,78),f=fishEls();for(var i=0;i<f.length;i++)f[i].style.setProperty('--fs',(size+i*1.2)+'px')}function pulse(cls){var f=fishEls();for(var i=0;i<f.length;i++){f[i].classList.add(cls);(function(x){setTimeout(function(){x.classList.remove(cls)},800)})(f[i])}}function draw(){E('day').textContent=day;E('fishN').textContent=fish;E('weight').textContent=Math.round(weight)+'g';E('score').textContent=Math.max(0,Math.round(score));E('doT').textContent=oxygen.toFixed(1);E('tempT').textContent=temp.toFixed(1);E('salT').textContent=sal.toFixed(0);bar('doB',oxygen,2,9,5,8);bar('tempB',temp,20,36,26,30);bar('salB',sal,0,35,8,25);growFish()}function updateRecord(){var h=board.highScore||{};E('champName').textContent=h.name||'尚未有人上榜';E('champScore').textContent=Number(h.score||0)}async function loadBoard(){try{var url=apiUrl?apiUrl:('scores.json?t='+Date.now());var r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('load failed');var d=await r.json();if(d.highScore)board.highScore=d.highScore;if(Array.isArray(d.top10))board.top10=d.top10;updateRecord()}catch(e){try{var local=JSON.parse(localStorage.getItem('xiaoyugeHighScore')||'null');if(local&&local.score>Number(board.highScore.score||0)){board.highScore=local;board.top10=[local]}}catch(_e){}updateRecord()}}function addFx(cls,text,left,top,life){var d=document.createElement('div');d.className=cls;if(text)d.textContent=text;if(left!=null)d.style.left=left;if(top!=null)d.style.top=top;E('fx').appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},life||1000)}function feedAnim(){for(var i=0;i<20;i++)setTimeout(function(){addFx('pellet','•',(12+Math.random()*74)+'%',null,1000)},i*25);pulse('eat')}function aerateAnim(){addFx('wheel','⚙️',null,null,1500);for(var i=0;i<32;i++)setTimeout(function(){var z=7+Math.random()*11,d=document.createElement('i');d.className='bubble';d.style.width=z+'px';d.style.height=z+'px';d.style.left=(8+Math.random()*28)+'%';d.style.top=(58+Math.random()*12)+'%';E('fx').appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},1900)},i*45)}function waterAnim(){for(var i=0;i<7;i++)setTimeout(function(){addFx('flow','💧',null,(32+Math.random()*20)+'%',1100)},i*70);addFx('flash','',null,null,500)}function checkAnim(){addFx('flash','',null,null,500)}function nextAnim(){addFx('sunrise','',null,null,1100)}function start(){day=1;fish=100;weight=20;score=0;oxygen=6;temp=28;sal=15;feedDone=0;waterDone=0;running=true;E('overlay').style.display='none';say('第 1 天：先看水質，再決定操作。');draw()}function feed(){if(!running)return;if(feedDone>=2){say('今天已餵兩次，再餵可能浪費飼料並惡化水質。');return}feedDone++;if(oxygen>=4.5){weight+=rnd(8,13);score+=12;say('餵食成功！虱目魚正在搶食。')}else{weight+=rnd(2,5);score-=5;say('溶氧偏低，魚吃得不好，先開水車。')}oxygen-=.25;feedAnim();pulse('grow');draw()}function aerate(){if(!running)return;oxygen=clamp(oxygen+1.6,2,9);score+=6;aerateAnim();say('水車運轉，水中溶氧提高！');draw()}function water(){if(!running)return;if(waterDone){say('今天已換過水，避免過度換水造成波動。');return}waterDone=1;oxygen=clamp(oxygen+.7,2,9);sal=clamp(sal+rnd(-2,2),0,35);temp+=(28-temp)*.35;score+=5;waterAnim();say('換水完成，水質更穩定。');draw()}function check(){if(!running)return;checkAnim();var t=[];t.push(oxygen<5?'溶氧偏低，建議開水車':'溶氧正常');t.push(temp<26?'水溫偏低':temp>30?'水溫偏高':'水溫適合');t.push(sal<8||sal>25?'鹽度波動較大':'鹽度穩定');say('水質報告：'+t.join('；')+'。')}function next(){if(!running)return;nextAnim();var healthy=true;if(oxygen<4){var loss=Math.ceil(rnd(3,8));fish=Math.max(0,fish-loss);score-=loss*8;healthy=false;say('昨晚缺氧，損失 '+loss+' 尾魚！')}else if(oxygen<5){fish=Math.max(0,fish-1);score-=4;healthy=false}if(temp<24||temp>33){var l=Math.ceil(rnd(1,4));fish=Math.max(0,fish-l);score-=l*5;healthy=false}if(feedDone===0){score-=5;healthy=false}else score+=5;if(healthy)score+=12;day++;feedDone=0;waterDone=0;oxygen=clamp(oxygen-rnd(.45,.85),2,9);temp=clamp(temp+rnd(-1.2,1.5),22,35);sal=clamp(sal+rnd(-1.7,1.7),0,35);if(Math.random()<.22){var e=Math.random();if(e<.34){temp=clamp(temp+rnd(2,3.5),22,36);say('☀️ 炎熱天氣，水溫升高，注意溶氧！')}else if(e<.67){oxygen=clamp(oxygen-rnd(.8,1.4),2,9);say('🌥️ 氣壓變化，溶氧下降，記得巡池。')}else{sal=clamp(sal-rnd(3,5),0,35);say('🌧️ 下雨後鹽度下降，注意水質。')}}else if(day<=20)say('第 '+day+' 天開始，先看水質再操作。');if(day>20||fish<=0){finish();return}draw()}function leaderboardRows(){var rows=Array.isArray(board.top10)?board.top10:[];if(!rows.length)return '<p>目前還沒有排行榜紀錄。</p>';var out='<table class="leaderboard"><tr><th>名次</th><th>姓名</th><th>分數</th><th>日期</th></tr>';for(var i=0;i<rows.length;i++){var r=rows[i]||{};out+='<tr><td>'+(i+1)+'</td><td class="n"></td><td>'+Number(r.score||0)+'</td><td>'+(r.date||'')+'</td></tr>'}return out+'</table>'}function fillLeaderboardNames(){var cells=E('overlay').querySelectorAll('.leaderboard .n'),rows=board.top10||[];for(var i=0;i<cells.length;i++)cells[i].textContent=(rows[i]&&rows[i].name)||''}function showLeaderboard(){if(running)return;E('overlay').style.display='flex';E('overlay').innerHTML='<div class="dialog"><div class="icon">🏆</div><h2>Top 10 排行榜</h2>'+leaderboardRows()+'<button id="closeRank" class="secondary" type="button">關閉</button></div>';fillLeaderboardNames();E('closeRank').onclick=function(){location.reload()}}async function submitHighScore(finalScore){var input=E('winnerName'),status=E('saveStatus'),btn=E('saveWinner');var name=(input.value||'').replace(/[<>]/g,'').trim().slice(0,12);if(!name){status.textContent='請輸入姓名';input.focus();return}btn.disabled=true;status.textContent='正在儲存…';var entry={name:name,score:finalScore,date:new Date().toISOString().slice(0,10)};try{localStorage.setItem('xiaoyugeHighScore',JSON.stringify(entry))}catch(_e){}if(!apiUrl){board.highScore=entry;board.top10=[entry].concat(board.top10||[]).sort(function(a,b){return Number(b.score||0)-Number(a.score||0)}).slice(0,10);updateRecord();status.textContent='已先儲存在這台裝置；線上 GitHub 排行榜等待後端連線。';btn.textContent='已暫存';return}try{var r=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,score:finalScore})});var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'儲存失敗');if(d.highScore)board.highScore=d.highScore;if(Array.isArray(d.top10))board.top10=d.top10;updateRecord();status.textContent=d.newHigh?'✅ 新紀錄已儲存到 GitHub！':'已有更高的新紀錄，排行榜已更新。';btn.textContent='已儲存'}catch(err){status.textContent='線上儲存暫時失敗，已保留在這台裝置。';btn.disabled=false}}function finish(){running=false;var finalScore=Math.max(0,Math.round(score+fish*2+weight*.5)),grade=finalScore>=650?'🏆 漁場達人':finalScore>=500?'🥇 養殖高手':finalScore>=350?'🥈 穩定經營':'🥉 再接再厲';var oldHigh=Number((board.highScore&&board.highScore.score)||0);var isHigh=finalScore>oldHigh;E('overlay').style.display='flex';if(isHigh){E('overlay').innerHTML='<div class="dialog"><div class="icon">🏆🎉</div><h2>新最高分！</h2><p>'+grade+'<br>存活：<b>'+fish+'</b> 尾　平均重量：<b>'+Math.round(weight)+'g</b><br>總分：<b style="font-size:28px;color:#c57c16">'+finalScore+'</b></p><p>留下你的姓名，成為小宇哥漁場紀錄保持人：</p><input id="winnerName" class="nameInput" maxlength="12" autocomplete="off" inputmode="text" placeholder="請輸入姓名"><br><button id="saveWinner" class="start" type="button">儲存最高分</button><div id="saveStatus" class="saveStatus"></div><button id="again" class="secondary" type="button">再養一池</button></div>';E('saveWinner').onclick=function(){submitHighScore(finalScore)};E('again').onclick=function(){location.reload()};setTimeout(function(){E('winnerName').focus()},250)}else{E('overlay').innerHTML='<div class="dialog"><div class="icon">🐟🎉</div><h2>'+grade+'</h2><p>20 天養殖完成！<br>存活：<b>'+fish+'</b> 尾<br>平均重量：<b>'+Math.round(weight)+'g</b><br>總分：<b style="font-size:27px;color:#2f95a6">'+finalScore+'</b><br>目前最高：<b>'+oldHigh+'</b> 分</p><button id="showRank" class="start" type="button">查看排行榜</button><br><button id="again" class="secondary" type="button">再養一池</button></div>';E('showRank').onclick=showLeaderboard;E('again').onclick=function(){location.reload()}}}E('start').onclick=start;E('feed').onclick=feed;E('aerate').onclick=aerate;E('water').onclick=water;E('check').onclick=check;E('next').onclick=next;E('rankBtn').onclick=showLeaderboard;draw();loadBoard()})();
</script></body></html>
